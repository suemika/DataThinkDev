<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/elementui/css/index.css">
  <style>
    body {
        position: absolute;
        width:100%;
        height:100vh;
        background-color:white;
        overflow:hidden;
    }
    .login-wrap{
        position: relative;
        width:100%;
        height:100%;
        background-image: url(/elementui/images/login-bg.jpg);
        background-size: 100%;
    }
    .ms-title{
        width:100%;
        line-height: 50px;
        text-align: center;
        font-size:20px;
        color: #fff;
        border-bottom: 1px solid #ddd;
    }
    .ms-login{
        position: absolute;
        left:50%;
        top:50%;
        width:350px;
        margin:-190px 0 0 -175px;
        border-radius: 5px;
        background: rgba(255,255,255, 0.3);
        overflow: hidden;
    }
    .ms-content{
        padding: 30px 30px;
    }
    .login-btn{
        text-align: center;
    }
    .login-btn button{
        width:100%;
        height:36px;
        margin-bottom: 10px;
    }
    .login-tips{
        font-size:12px;
        line-height:30px;
        color:#fff;
    }
</style>
</head>
<body>
<div id="app" class="login-wrap">
        <div class="ms-login">
            <div class="ms-title">石横特钢综合管理平台</div>
            <el-alert v-if="visiable"
                title="用户名或密码错误，请检查后重试！"
                type="error"
                effect="dark">
            </el-alert>
            <el-form :model="ruleForm" :rules="rules" ref="ruleForm" label-width="0px" class="ms-content">
                <el-form-item prop="username">
                    <el-input v-model="ruleForm.username" placeholder="用户名" prefix-icon="el-icon-user">
                    </el-input>
                </el-form-item>
                <el-form-item prop="password">
                    <el-input type="password" placeholder="密码" v-model="ruleForm.password" @keyup.enter.native="submitForm('ruleForm')" prefix-icon="el-icon-lock">
                    </el-input>
                </el-form-item>
                <div class="login-btn">
                    <el-button type="primary" @click="submitForm('ruleForm')">登录</el-button>
                </div>
                <p class="login-tips">内部用户请使用EAS账号密码登录<br>外部用户请使用用户名、密码登录</p>
            </el-form>
        </div>
    </div>
</body>
  <script src="/elementui/js/vue.js"></script>
  <script src="/elementui/js/index.js"></script>
  <script src="/elementui/js/axios.min.js"></script>
<script src="/elementui/js/vue-cookies.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: function(){
            return {
                visiable:false,
                ruleForm: {
                    username: '',
                    password: ''
                },
                rules: {
                    username: [
                        { required: true, message: '请输入用户名', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ]
                }
            }
        },
        methods: {
            submitForm(formName) {
                this.$refs[formName].validate((valid) => {
                    if (valid) {
                        let that = this;
                        axios.post('/login/sys',{account:this.ruleForm.username,password:this.ruleForm.password}).then(function (response) {
                            if(response.data===0){
                                that.visiable=true;
                                that.$cookies.remove('sessionidd');
                            }
                            else{
                                that.$cookies.set("sessionidd",response.data,{expires:360,});
                                window.location.href="/";
                            }
                        }).catch(function (error) {
                            console.log(error);
                        });
                    } else {
                        console.log('error submit!!');
                        return false;
                    }
                    });
            }
        }
    })
  </script>
</html>
