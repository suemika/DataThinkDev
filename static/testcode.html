<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		 <script src="https://unpkg.com/html5-qrcode"></script>	
	</head>
	<body>
		    <p id="nihao"></p>
		    <button onclick="getCameras()">扫码</button>
		    <div class="qrcode">
		        <div id="reader"></div>
		    </div>
		
	</body>
	
	
	<script>
			let html5QrCode = null;
			
			// 获取摄像头权限
			const getCameras = () => {	
				console.log('测试')
		        Html5Qrcode.getCameras()
		            .then((devices) => {
		            	// 返回的是你的摄像设备列表，手机有两个摄像头，电脑返回一个摄像头
		            	// 初始化扫描程序，在这里需要传递标签的id，第二个参数用来控制识别类型（没用过）
		                html5QrCode = new Html5Qrcode("reader");
						console.log('测试成功')
		                start();
		            })
		            .catch((err) => {
						console.log('测试失败')
		                html5QrCode = new Html5Qrcode("reader")
		            })
		    }
		    // 开始扫描相机给的二维码
		    const start = () => {
		        document.querySelector('button').style.display = 'none';
		        html5QrCode.start(
		            // environment后置摄像头 user前置摄像头 也可以传递获取摄像头时的id
		            // 也可以是这样的{ deviceId: { exact: cameraId} }
		            { facingMode: "environment" },
		            {
		                fps: 20, // 可选，每秒帧扫描二维码
		                qrbox: { width: 700, height: 700 }, // 可选，如果你想要有界框UI
		                aspectRatio: 1.777778 // 可选，视频馈送需要的纵横比，(4:3--1.333334, 16:9--1.777778, 1:1--1.0)传递错误的纵横比会导致视频不显示
						// torch: true, // 尝试使用闪光灯来提高对焦能力
						// focusMode: 'continuous', // 连续自动对焦模式（如果浏览器支持）
						// minDetectionContrast: 0.5 // 设置最小检测对比度，有助于在低对比度环境下对焦
		            },
		            (decodedText, decodedResult) => {
		            	// 成功的回调函数
		                alert(decodedText);
		                stop();
		            })
		            // 这里应该还有一个错误回调函数(没有识别到的时候会执行，太频繁了，没写)
		    }
		    // 停止摄像头
		    const stop = () => {
		        html5QrCode.stop()
		        	.then((suc) => {
		            	console.log("关闭摄像头")
		        	})
			        .catch((err) => {
			            console.log("关闭摄像头的时候报错了")
			        })
		    }


	</script>
	<style>
		    * {
		        padding: 0;
		        margin: 0;
		    }
		    html,
		    body {
		        height: 100%;
		    }
		    p {
		        position: fixed;
		        top: 50%;
		        left: 50%;
		        transform: translate(-50%, -50%);
		        z-index: 4;
		    }
		    button {
		        position: fixed;
		        top: 50%;
		        left: 50%;
		        transform: translate(-50%, -50%);
		        z-index: 3;
		    }
		
		    .qrcode {
		        display: flex;
		        top: 0;
		        left: 0;
		        height: 100vh;
		    }
		
		    #reader {
		        position: fixed;
		        top: 50%;
		        transform: translateY(-50%);
		        width: 100%;
		        height: 100%;
		        pointer-events: none;
		    }
		    #reader video {
		        height: 100%;
		        width: 100%;
		        display: block;
		        object-fit: cover;
		    }
	</style>
</html>
