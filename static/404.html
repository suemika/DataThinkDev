<!DOCTYPE html>
<html>
<head>
  <title>权限提示</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #F4F4F4, #D7D7D7);
      background-repeat: repeat;
      text-align: center;
      padding-top: 100px;
    }
    
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 30px;
    }
    
    p {
      color: #666;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .container {
      width: 400px;
      margin: 0 auto;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 30px;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
    }
    
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      font-size: 16px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    
    .button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>您暂无相关权限</h1>
	<p>
	<p>
    <a href="/" class="button">返回首页</a>
  </div>
</body>
</html>
