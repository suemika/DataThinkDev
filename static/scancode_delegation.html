<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>扫码委托质检表</title>
    <!-- 引入Bootstrap样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* 提交按钮宽度设置为100% */
        #submitBtn {
            width: 100%;
        }

        /* 设置备注和工资编号的高度一致 */
        #remarks,
        #salaryNumber {
            height: 38px; /* 您可以根据需要调整高度 */
        }


        /* 添加加粗样式到列名 */
        label {
            font-weight: bold;
        }

        /* 自定义提示框样式 */
        .alert-custom {
            padding: 10px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .alert-custom.success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .alert-custom.error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        /* 淡入动画 */
        .alert-custom.fade-in {
            opacity: 1;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="text-center">委托质检表</h2>
        </div>
        <div class="card-body">
            <form id="myForm">
                <!-- 以下使用col-md-6类来控制列宽 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="sampleName" class="form-label">试样名称</label>
                        <select class="form-select" id="sampleName" name="试样名称" required>
                            <option value="">请选择试样名称</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="samplingLocation" class="form-label">取样地点</label>
                        <select class="form-select" id="samplingLocation" name="取样地点" required>
                            <option value="">请选择取样地点</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="actualSampleNumber" class="form-label">实际样号</label>
                        <input type="text" class="form-control" id="actualSampleNumber" name="实际样号" required>
                    </div>
                    <div class="col-md-6">
                        <label for="carNumber" class="form-label">车号</label>
                        <input type="text" class="form-control" id="carNumber" name="车号" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="processingCenter" class="form-label">加工中心名称</label>
                        <select class="form-select" id="processingCenter" name="加工中心名称" required>
                            <option value="">请选择加工中心</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="destination" class="form-label">发往单位</label>
                        <input type="text" class="form-control" id="destination" name="发往单位" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="materialName" class="form-label">物料名称</label>
                        <select class="form-select" id="materialName" name="物料名称" disabled required>
                            <option value="">请选择物料名称</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="schemeName" class="form-label">方案名称</label>
                        <select class="form-select" id="schemeName" name="方案名称" disabled required>
                            <option value="">请选择方案名称</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="remarks" class="form-label">备注</label>
                        <textarea class="form-control" id="remarks" name="备注" rows="3"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label for="salaryNumber" class="form-label">工资编号</label>
                        <input type="text" class="form-control" id="salaryNumber" name="工资编号" required>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="row">
                    <div class="col-12">
                        <button type="button" id="submitBtn" class="btn btn-primary btn-block">提交</button>
                    </div>
                </div>

                <!-- 提示框容器 -->
                <div id="alertContainer"></div>
            </form>
        </div>
    </div>
</div>

<script>
    var alertContainer = document.getElementById('alertContainer');

    // 函数：显示提示框
    function showAlert(message, isSuccess) {
        // 先删除已存在的提示框
        var existingAlert = alertContainer.querySelector('.alert');
        if (existingAlert) {
            alertContainer.removeChild(existingAlert);
        }

        // 创建新的提示框
        var alertDiv = document.createElement('div');
        alertDiv.classList.add('alert', 'mt-3', 'alert-custom', isSuccess ? 'success' : 'error', 'fade-in');
        alertDiv.innerHTML = message;
        alertContainer.appendChild(alertDiv);

        // 设置定时器，在3秒后隐藏提示框
        setTimeout(function () {
            alertDiv.classList.remove('fade-in');
            setTimeout(function () {
                var existingAlert = alertContainer.querySelector('.alert');
                if (existingAlert && alertContainer.contains(existingAlert)) {
                    alertContainer.removeChild(existingAlert);
                }
            }, 300);
        }, 3000); // 3秒后隐藏
    }

    // 通用函数用于填充下拉框选项
    function fillSelectOptions(selectElement, dataList) {
        selectElement.innerHTML = '';
        var defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '请选择' + selectElement.name;
        selectElement.appendChild(defaultOption);

        dataList.forEach(function (item) {
            var option = document.createElement('option');
            option.value = item[0];
            option.textContent = item[1];
            selectElement.appendChild(option);
        });
    }

    // 获取下拉框数据并填充
    function populateSelect(selectElement, url) {
        $.ajax({
            type: 'POST',
            url: url,
            data: {
                req: 1
            },
            cache: false,
            dataType: 'json',
            success: function (data) {
                fillSelectOptions(selectElement, data);
            },
            error: function () {
                // 处理错误情况
            }
        });
    }

    // 初始化下拉框数据
    populateSelect(document.getElementById('sampleName'), '/imc/getSampleNameData');
    populateSelect(document.getElementById('samplingLocation'), '/imc/getSamplingLocationData');
    populateSelect(document.getElementById('processingCenter'), '/imc/getProcessingCenterData');

    // 加工中心改变事件处理
    document.getElementById('processingCenter').addEventListener('change', function () {
        var materialNameSelect = document.getElementById('materialName');
        materialNameSelect.disabled = this.value === '';

        // 如果选择了加工中心，查询物料名称数据
        if (this.value !== '') {
            populateSelect(materialNameSelect, '/imc/getMaterialNameSelectData');
        } else {
            // 清空物料名称下拉框
            materialNameSelect.innerHTML = '<option value="">请选择物料名称</option>';
            materialNameSelect.disabled = true;
        }
    });

    // 物料名称改变事件处理
    document.getElementById('materialName').addEventListener('change', function () {
        var schemeNameSelect = document.getElementById('schemeName');
        schemeNameSelect.disabled = this.value === '';

        // 如果选择了物料名称，查询方案名称数据
        if (this.value !== '') {
            // 使用所选的物料名称值来查询方案名称
            populateSelect(schemeNameSelect, '/imc/getSchemeNameSelectData?mateCode=' + this.value);
        } else {
            // 清空方案名称下拉框
            schemeNameSelect.innerHTML = '<option value="">请选择方案名称</option>';
            schemeNameSelect.disabled = true;
        }
    });

    // 提交按钮点击事件处理
    document.getElementById('submitBtn').addEventListener('click', function () {
        var formData = {};
        var formValid = true;
        var inputFields = document.querySelectorAll('input, select');

        inputFields.forEach(function (field) {
            formData[field.name] = field.value;

            if (field.required && field.value.trim() === '') {
                formValid = false;
                field.classList.add('is-invalid');
            } else {
                field.classList.remove('is-invalid');
            }
        });

        if (!formValid) {
            // 错误提示框
            showAlert('请填写所有字段！', false);
            return;
        }

        formData['remarks'] = document.getElementById('remarks').value;
        formData['SchemeNameText'] = document.getElementById('schemeName').options[document.getElementById('schemeName').selectedIndex].text;

        fetch('/imc/insertScanCodeDelegationData', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                // 在这里可以处理后台返回的数据，例如显示成功消息
                showAlert(data.msg, true);
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert(data.msg, false);
            });
    });
</script>
</body>

</html>
