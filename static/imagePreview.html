<!DOCTYPE html>
<html>
<head>
    <title>图片预览</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Access-Control-Allow-Origin" content="*"/>
    <!-- import CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="../elementui/js/jquery-3.7.0.min.js"></script>
</head>
<body>
<div id="app">
    <template>
        <el-carousel :interval="5000" arrow="always" height="98.8vh">
            <el-carousel-item v-for="item in imgUrls" :key="item">
                <div style="display: flex;align-content: center;justify-content: center;">
                    <el-image style="height: 98.7vh;" :src="item" fit="scale-down" :preview-src-list="imgUrls"></el-image>
                </div>
            </el-carousel-item>
        </el-carousel>
    </template>
</div>
</body>
<script src="../elementui/js/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            imgUrls: []
        },
        mounted() {
            this.GetQueryString();
        },
        methods: {
            GetQueryString() {
                const searchParams = new URLSearchParams(window.location.search);
                const params = {};

                for (const [key, value] of searchParams.entries()) {
                    params[key] = value;
                }
                const arr = params['imgUrls'].split(',');
                for (i = 0; i < arr.length; i++) {
                    arr[i] = arr[i].replace(/\*/g, '&');
                }
                this.imgUrls = arr;
            }
        }
    })
</script>
<style>
    .el-carousel__item h3 {
        color: #475669;
        font-size: 18px;
        opacity: 0.75;
        line-height: 300px;
        margin: 0;
    }

    .el-carousel__item:nth-child(2n) {
        background-color: #99a9bf;
    }

    .el-carousel__item:nth-child(2n+1) {
        background-color: #d3dce6;
    }
</style>
</html>
