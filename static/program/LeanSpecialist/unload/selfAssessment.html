<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精益认证个人自评表</title>
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../vendor/logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<link rel="stylesheet" href="../vendor/bootstrap5/css/bootstrap.min.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="../bootstrap-icons-1.11.3/font/bootstrap-icons.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="util/util.css?v=' + randomVersion + '">');
        document.write('<script src="../vendor/easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="vendor/util/util_link.js"?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/bootstrap5/js/bootstrap.bundle.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        :root {
            --border-radius: 10px;
            --primary-color: #4361ee;
            --secondary-color: #007bff;
            --accent-color: #4895ef;
            --light-bg: #f8f9fa;
            --card-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.1);
        }

        .nav-style {
            margin: 1px auto 3rem auto;
            max-width: 800px;
            background-color: var(--background);
            width: calc(100% - 20px);
        }

        /* 面包屑导航 */
        .breadcrumb {
            background: var(--background);
            padding: 1.05rem 1rem;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
        }

        .breadcrumb-item a {
            color: var(--secondary-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
        }

        .breadcrumb-item a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .breadcrumb-item.active {
            color: var(--text-light);
            font-weight: 500;
        }

        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            transition: all 0.3s ease;
            overflow: hidden;
            background: white;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px -15px rgba(0, 0, 0, 0.15);
        }

        .card-body {
            padding: 2rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .content-section {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background-color: rgba(72, 149, 239, 0.05);
            border-radius: var(--border-radius);
            border-left: 4px solid var(--accent-color);
        }

        .level {
            font-weight: 600;
            margin-top: 1rem;
            display: inline-block;
            color: var(--primary-color);
            font-size: 1.1rem;
            background-color: rgba(67, 97, 238, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        .level-description {
            font-size: 0.95rem;
            color: #555;
            margin-left: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            color: #444;
        }

        .form-control {
            border-radius: var(--border-radius);
            border: 1px solid #ddd;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }

        .score-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%234361ee' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
            appearance: none;
        }

        .btn-submit {
            margin-top: 1.5rem;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(67, 97, 238, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.3);
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
        }

        .btn-submit:disabled {
            background: #cccccc;
            color: #fff;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-submit i {
            margin-right: 8px;
        }

        hr {
            margin: 2rem 0;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            header h2 {
                font-size: 1.5rem;
            }

            .card-body {
                padding: 1.5rem;
            }

            .content-section {
                padding: 1rem;
            }
        }

        /* 添加按钮状态样式 */
        .btn-submit.btn-loading {
            background: linear-gradient(to right, #6c757d, #adb5bd);
        }

        .btn-submit.btn-success {
            background: linear-gradient(to right, #0092ff, #20c997);
        }

        .btn-submit:disabled {
            background: linear-gradient(to right, #0092ff, #20c997);
            opacity: 1;
        }

        /* 添加按钮动画 */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        .btn-submit.btn-loading {
            animation: pulse 1.5s infinite;
        }


        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.3);
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
        }

        i{
            margin-right: 8px;
        }
    </style>
</head>

<body class="poppins-bold">

<!-- 遮罩层 -->
<div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">

        <div class="diamond-loader">
            <!-- 静态阴影 -->
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
        </div>
        <div class="shadow"></div>
        <p class="mt-3">正在加载，请稍候...</p>
    </div>
</div>
<header class="background-container text-center">
    <img id="header-img" src="" alt="ST" style="height: 60px;">
</header>
<div class="user-name"><span id="userName"></span></div>
<nav aria-label="面包屑导航" class="nav-style">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="lean_intro.html"><i class="bi bi-house-door"></i>认证阶段</a></li>
        <li class="breadcrumb-item"><a href="lean_intro.html"><i class="bi bi-card-checklist"></i>个人自评表</a></li>
        <li class="breadcrumb-item active"><i class="bi bi-file-earmark-text"></i>详情</li>
    </ol>
</nav>
<main class="container_main" id="mainContent">
    <div id="evaluation-container"></div>
</main>

<script>
    const userFID = getNameFromUrl("userName");
    const p = getNameFromUrl("p");
    const role = getNameFromUrl("role");
    let status = null;
    let userName = null;
    const redirectIntroURL = `lean_intro.html?userName=${encodeURIComponent(userFID)}&role=${role}`;
    const redirectSignURL = `sign_up.html?userName=${encodeURIComponent(userFID)}`;

    window.onscroll = function () {
        toggleBackToTopButton();
    };

    async function loadList() {
        await getUserInfo(userFID);
        const response = await fetchDataFromAPI('679', p);
        if (response.data.status === 0) {
            return response.data.data;
        }
        return null;
    }

    async function getUserInfo(userFID) {

        const feedbackData = {
            userName: userFID,
            role: role,
            type: 2
        };

        const response = await fetchDataFromAPI('759', feedbackData);


        if (response.data.status === 0) {
            status = response.data.user_status;
            userName = response.data.userNumber;
            document.getElementById('userName').textContent = response.data.user_name
        }
    }

    async function submitRating(modelId, event) {
    const submitButton = event.currentTarget;
    const card = submitButton.closest('.card-body');
    const scoreSelect = card.querySelector(`.score-select[data-definition-id="${modelId}"]`);
    const exampleTextarea = card.querySelector(`.example-textarea[data-definition-id="${modelId}"]`);

    if (!scoreSelect || !exampleTextarea) {
        console.error(`Elements not found for modelId: ${modelId}`);
        return;
    }

    const score = scoreSelect.value;
    const example = exampleTextarea.value;

    if (!score) {
        alert('请先选择分数！');
        return;
    }

    if (!example) {
        alert('请填写评分举例说明！');
        return;
    }

    // 保存原始按钮内容和样式
    const originalButtonHTML = submitButton.innerHTML;
    const originalButtonClass = submitButton.className;
    const originalButtonState = {
        disabled: submitButton.disabled,
        className: submitButton.className,
        innerHTML: submitButton.innerHTML
    };

    // 更新按钮为加载状态
    submitButton.disabled = true;
    submitButton.className = 'btn-submit btn-loading';
    submitButton.innerHTML = '<i class="bi bi-hourglass-split me-2"></i> 提交中...';

    const submissionData = {
        userName: userName,
        modelId: modelId,
        definitionId: p,
        score: score,
        example: example,
        role: role
    };

    try {
        const response = await fetchDataFromAPI('681', submissionData);
        if (response.data.status === 0) {
            // 更新按钮为成功状态
            submitButton.className = 'btn-submit btn-success';
            submitButton.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> 已提交';

            // 创建并显示成功提示
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-success alert-dismissible fade show';
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '1000';
            alertDiv.style.maxWidth = '350px';
            alertDiv.innerHTML = `
                <i class="bi bi-check-circle-fill"></i> <strong>已成功提交!</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(alertDiv);

            // 3秒后自动关闭提示
            setTimeout(() => {
                alertDiv.classList.remove('show');
                setTimeout(() => alertDiv.remove(), 150);
                submitButton.disabled = originalButtonState.disabled;
                submitButton.className = originalButtonState.className;
                submitButton.innerHTML = originalButtonState.innerHTML;
            }, 3000);

        } else {
            // 提交失败，显示错误提示
            const errorAlert = document.createElement('div');
            errorAlert.className = 'alert alert-danger alert-dismissible fade show';
            errorAlert.style.position = 'fixed';
            errorAlert.style.top = '20px';
            errorAlert.style.right = '20px';
            errorAlert.style.zIndex = '1001';
            errorAlert.style.maxWidth = '350px';
            errorAlert.innerHTML = `
                <i class="bi bi-exclamation-triangle-fill"></i> <strong>提交失败!</strong> ${response.data.msg || '请稍后重试'}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(errorAlert);

            // 3秒后自动关闭错误提示
            setTimeout(() => {
                errorAlert.classList.remove('show');
                setTimeout(() => errorAlert.remove(), 150);
            }, 3000);

            // 3秒后恢复按钮状态
            setTimeout(() => {
                submitButton.disabled = originalButtonState.disabled;
                submitButton.className = originalButtonState.className;
                submitButton.innerHTML = originalButtonState.innerHTML;
            }, 3000);

            // 记录错误日志
            await saveDataToAPI({
                workId: userName,
                sourceAddress: window.location.pathname + '  lineNumber-> 392',
                error: response.data.msg,
                reqData: submissionData
            });
        }
    } catch (error) {
        console.error('提交过程中出错：', error);

        // 网络错误或其他异常
        const errorAlert = document.createElement('div');
        errorAlert.className = 'alert alert-danger alert-dismissible fade show';
        errorAlert.style.position = 'fixed';
        errorAlert.style.top = '20px';
        errorAlert.style.right = '20px';
        errorAlert.style.zIndex = '1001';
        errorAlert.style.maxWidth = '350px';
        errorAlert.innerHTML = `
            <i class="bi bi-exclamation-triangle-fill"></i> <strong>网络错误!</strong> 请检查网络连接后重试
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        document.body.appendChild(errorAlert);

        // 3秒后自动关闭错误提示
        setTimeout(() => {
            errorAlert.classList.remove('show');
            setTimeout(() => errorAlert.remove(), 150);
        }, 3000);

        // 3秒后恢复按钮状态
        setTimeout(() => {
            submitButton.disabled = originalButtonState.disabled;
            submitButton.className = originalButtonState.className;
            submitButton.innerHTML = originalButtonState.innerHTML;
        }, 3000);
    }
}

    function renderData(data) {
        const container = document.getElementById("evaluation-container");
        data.forEach((item, index) => {
            const card = document.createElement("div");
            card.classList.add("card", "mb-4");
            card.innerHTML = `
            <div class="card-body">
                <h3 class="card-title">${item.title || '能力评估'}</h3>
                ${item.definitions
                .map(def => {
                    const buttonId = `submit-btn-${def.id}`;
                    return `<div class="content-section">
                            <h4 class="mb-3"><i class="bi bi-check-circle-fill text-primary me-2"></i>${def.definition}</h4>
                            ${def.levels
                        .map(
                            level =>
                                `<div class="mb-3">
                                <div class="level">
                                    <i class="bi bi-star-fill me-1"></i>${level.level}
                                    <span class="level-description">${level.detail}</span>
                                </div>
                                <div class="ps-1 mt-2">${level.description}</div>
                            </div>`
                        )
                        .join("")}
                            <div class="mt-4">
                                <label class="form-label"><i class="bi bi-123 me-2"></i>个人自评得分：</label>
                                <select class="form-select form-control score-select" data-definition-id="${def.id}">
                                    <option value="" disabled selected>请选择分数</option>
                                    <option value="0">0分 (完全不具备)</option>
                                    <option value="0.5">0.5分</option>
                                    <option value="1">1分 (初学阶段)</option>
                                    <option value="1.5">1.5分</option>
                                    <option value="2">2分 (基础掌握)</option>
                                    <option value="2.5">2.5分</option>
                                    <option value="3">3分 (熟练应用)</option>
                                    <option value="3.5">3.5分</option>
                                    <option value="4">4分 (专业水平)</option>
                                    <option value="4.5">4.5分</option>
                                    <option value="5">5分 (专家级别)</option>
                                </select>
                            </div>
                            <div class="mt-3">
                                <label class="form-label"><i class="bi bi-pencil-square me-2"></i>评分举例说明：</label>
                                <textarea class="form-control example-textarea" data-definition-id="${def.id}" rows="4" placeholder="请详细描述您选择此分数的具体原因和实例..."></textarea>
                            </div>
                            <button class="btn-submit" id="${buttonId}">
                                <i class="bi bi-send-fill"></i>提交评分
                            </button>
                        </div>`
                })
                .join("")}
            </div>`;
            container.appendChild(card);

            // 为每个按钮添加事件监听
            item.definitions.forEach(def => {
                const buttonId = `submit-btn-${def.id}`;
                const button = document.getElementById(buttonId);
                if (button) {
                    button.onclick = (e) => submitRating(def.id, e);

                    // 获取对应的输入元素
                    const scoreSelect = document.querySelector(`.score-select[data-definition-id="${def.id}"]`);
                    const exampleTextarea = document.querySelector(`.example-textarea[data-definition-id="${def.id}"]`);

                    // 添加输入变化监听
                    const resetButtonState = () => {
                        button.disabled = false;
                        button.className = 'btn-submit';
                        button.innerHTML = '<i class="bi bi-send-fill"></i>提交评分';
                    };

                    if (scoreSelect) {
                        scoreSelect.addEventListener('change', resetButtonState);
                    }
                    if (exampleTextarea) {
                        exampleTextarea.addEventListener('input', resetButtonState);
                    }
                }
            });
        });
    }


    async function loadSelfEvaluationData() {
        const data = {
            userName: userName,
            definitionId: p,
            role: role
        };
        const response = await fetchDataFromAPI('682', data);
        if (response.data.status === 0) {
            const evaluations = response.data.data;
            evaluations.forEach(evaluation => {
                const modelId = evaluation.modelId;
                const score = evaluation.score;
                const example = evaluation.example;

                const scoreSelect = document.querySelector(`.score-select[data-definition-id="${modelId}"]`);
                const exampleTextarea = document.querySelector(`.example-textarea[data-definition-id="${modelId}"]`);

                if (scoreSelect) {
                    scoreSelect.value = score;
                }
                if (exampleTextarea) {
                    exampleTextarea.value = example;
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', async function () {
        // 先显示加载层
        util.loading.show();

        if (userFID === null) {
            window.location.href = "http://edi.sdstg.com/";
        }

        // 更新面包屑导航链接
        const breadcrumbLinks = document.querySelectorAll('.breadcrumb-item a');
        if (breadcrumbLinks.length >= 2) {
            breadcrumbLinks[0].href = redirectSignURL;
            breadcrumbLinks[1].href = redirectIntroURL;
        }


        // 加载和渲染数据
        const data = await loadList()
        if (data) {
            renderData(data);
            await loadSelfEvaluationData().finally(() => {
                // 无论成功失败都隐藏加载层
                util.loading.hide();
            });

        } else {
            console.error('数据加载失败');
        }

        // 如果状态存在，禁用交互
        if (status==="已通过") {
            const evaluationContainer = document.getElementById('evaluation-container');
            evaluationContainer.style.opacity = '0.7';

            // 禁用所有表单元素
            const formElements = document.querySelectorAll('select, textarea, button:not(.back-to-top button)');
            formElements.forEach(element => {
                if (element.tagName.toLowerCase() === 'textarea') {
                    element.readOnly = true; // 只读（可复制）
                    element.style.userSelect = 'text'; // 允许选择文本（iOS/Android）
                    element.style.webkitUserSelect = 'text'; // Safari 兼容
                    element.style.pointerEvents = 'auto'; // 允许触摸交互
                    element.style.overflow = 'auto'; // 确保滚动条可见
                } else {
                    element.disabled = true; // 禁用其他表单元素
                    element.style.cursor = 'not-allowed';
                }

                // 修改提交按钮样式
                if (element.classList.contains('btn-submit')) {
                    element.className = 'btn-submit btn-success';
                    element.innerHTML = '<i class="bi bi-lock"></i> 已提交';
                }
            });
        }
    });
</script>
</body>
</html>
