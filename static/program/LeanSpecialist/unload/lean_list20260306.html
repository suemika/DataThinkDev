<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精益认证报名</title>
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../vendor/logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<link rel="stylesheet" href="../vendor/bootstrap5/css/bootstrap.min.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="../bootstrap-icons-1.11.3/font/bootstrap-icons.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="util/util.css?v=' + randomVersion + '">');
        document.write('<script src="../util/sweetalert2@11.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="vendor/util/util_link.js"?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/bootstrap5/js/bootstrap.bundle.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        /* 其他 CSS 保持不变 */
        .container {
            display: flex;
            flex-direction: column;
            min-height: 68vh;
            margin: 0 auto;
            padding: 15px;
        }

        .row {
            display: flex;
            /* 使用 Flexbox 布局 */
            flex: 1;
            /* 使内容区域自适应 */
            flex-wrap: nowrap;
            /* 不换行，保持一行显示 */
        }

        .sidebar {
            text-align: center;
            flex: 0 0 25%;
            /* 设置侧边栏的固定宽度 */
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            /* 给侧边栏内边距 */
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            border-radius: 15px 0 0 15px;
            overflow-y: auto;
            /* 如果内容超过边栏高度，显示滚动条 */
        }

        .sidebar .nav-link {
            color: #333;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .sidebar .nav-link.active {
            background: #007bff;
            color: #fff;
        }

        .sidebar .nav-link:hover {
            background: #007bff;
            color: #fff;
        }

        .content {
            flex: 1;
            /* 自适应宽度 */
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 15px 15px 0;
            box-shadow: rgba(0, 0, 0, 0.1) 0 0 10px;
            overflow-y: auto;
            /* 如果内容超过，高度显示滚动条 */
        }

        .footer {
            margin-top: 8px;
            padding: 5px;
            text-align: center;
            width: 100%;
        }

        .btn-next {
            width: 80%;
            margin: 5px auto;
            border-radius: 20px;
            background: #007bff;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn-next:hover {
            background: #007bff;
            transform: scale(1.05);
        }

        /* 媒体查询 */
        @media (max-width: 768px) {
            .sidebar {
                flex: 0 0 25%;
                /* 在小屏幕上侧边栏占满一整行 */
                border-radius: 15px 0 0 15px;
            }

            .content {
                padding: 10px;
            }

            .btn-next {
                width: 95%;
                /* 调整按钮宽度 */
            }
        }

        @media (max-width: 576px) {
            .btn-next {
                width: 100%;
                /* 在超小屏幕上按钮宽度满屏 */
            }
        }

        /* 卡片样式 */
        .card {
            height: 50px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            /* 图片和文字并排显示 */
            align-items: center;
            /* 垂直对齐 */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card.active {
            background: #0092ff;
            color: rgba(255, 255, 255, 0.9);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* 图片设置 */
        .card img {
            width: 40px;
            /* 固定图片宽度 */
            height: 30px;
            margin-left: 30px;
            /* 图片与文字之间的间距 */
            border-radius: 10px;
            /* 可选：为图片增加圆角 */
        }

        .card-body {
            flex: 1; /* 文字区域占用剩余空间 */
            text-align: left;
            margin-left: 15px; /* 取消外边距 */
            padding: 0; /* 取消内边距 */
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-text {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.7);
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 1); /* 加深背景色 */
            display: none; /* 初始隐藏 */
            justify-content: center;
            align-items: center;
            z-index: 21; /* 确保最高层级 */
            backdrop-filter: blur(3px); /* 添加模糊效果 */
        }

        .loading-active {
            display: flex !important;
        }

        .overlay-content {
            color: #fff;
            font-size: 24px;
        }

        /* 当加载时再显示遮罩层 */
        .loading {
            visibility: visible;
            /* 显示遮罩层 */
        }

        /* 为禁用状态添加样式 */
        .btn-next:disabled {
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            /* 半透明白色 */
            color: rgba(0, 0, 0, 0.5);
            /* 灰色文本 */
            cursor: not-allowed;
            /* 光标变为禁用状态 */
            transform: none;
            /* 禁用时去掉缩放效果 */
        }

    </style>
</head>

<body class="poppins-bold">
<div id="loading-overlay">
    <div class="overlay-content">
        <h2 class="poppins-bold-italic">加载中，请稍候...</h2>
    </div>
</div>
<div class="user-name"><span id="userName"></span></div>

<header class="background-container">
    <img id="header-img" src="" alt="ST">
    <h2 class="poppins-bold-italic">精益认证平台</h2>
</header>

<main class="container_main">
    <nav aria-label="面包屑导航" class="nav-style">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="lean_list.html">认证阶段</a></li>
            <li class="breadcrumb-item active">报名</li>

    </nav>
    <div>
        <div id="statusAlertBar" class="alert alert-dismissible fade show mb-4" style="display: none;">
            <div class="d-flex align-items-center">
                <i id="statusAlertIcon" class="bi me-3 fs-4"></i>
                <div>
                    <h6 id="statusAlertTitle" class="alert-heading mb-1"></h6>
                    <div id="statusAlertContent" class="small"></div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row no-gutters">
            <div class="sidebar">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" id="pills-recommendation-tab" data-toggle="pill"
                           href="#pills-recommendation" role="tab" onclick="setActiveLink('recommendation')">认证</a>

                    <li class="nav-item">

                           onclick="setActiveLink('business')">业务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="pills-process-tab" data-toggle="pill" href="#pills-process" role="tab"
                           onclick="setActiveLink('process')">流程</a>

                    <li class="nav-item">

            <div class="content">

                    <div class="tab-pane fade show active" id="pills-recommendation" role="tabpanel">
                        <div class="card d-flex flex-row align-items-center" id="leanStudentCard"

                                <h5 class="card-title">精益学员</h5>
                            </div>

                        <div class="card d-flex flex-row align-items-center" id="leanLeaderCard"
                             onclick="setActiveCard('leanLeaderCard')">

                                <h5 class="card-title">精益骨干</h5>

                        <div class="card d-flex flex-row align-items-center" id="leanCoachCard"
                             onclick="setActiveCard('leanCoachCard')">
                            <img src="png/coach_inactive.svg" alt="精益教练">
                            <div class="card-body text-start">
                                <h5 class="card-title">精益教练</h5>

                        <div class="card d-flex flex-row align-items-center" id="seniorCoachCard"
                             onclick="setActiveCard('seniorCoachCard')">

                            <div class="card-body text-start">
                                <h5 class="card-title">资深教练</h5>

                    </div>
                    <div class="tab-pane fade" id="pills-business" role="tabpanel">

        <div class="footer">

<script>

    const userName = getNameFromUrl("gzbh");
    let user;
    let role;
    let userFid;

    async function checkSignUpStatus(roleName) {
        try {
            const {status, deadline} = await signUpStatus(roleName);
            if (status === 0) {
                await Swal.fire({
                    title: `${roleName} 报名已截止`,
                    html: `
                <div style="margin: 1rem 0; color: #555; font-size: 0.95rem;">
                    <div style="display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-clock" style="margin-right: 8px; color: #6c757d;"></i>
                        ${new Date().toLocaleString()}
                    </div>
                </div>
                <div style="color: #dc3545; font-weight: 500; background-color: #f8f9fa; padding: 0.5rem; border-radius: 0.25rem;">
                    <i class="bi bi-exclamation-circle"></i> 当前报名通道已关闭
                </div>
            `,
                    icon: 'error',
                    iconColor: '#ff6b81',
                    confirmButtonText: '我知道了',
                    confirmButtonColor: '#ff4757',
                    background: '#f8f9fa',
                    showClass: {
                        popup: 'animate__animated animate__fadeIn animate__faster'
                    },
                    hideClass: {
                        popup: 'animate__animated animate__fadeOut animate__faster'
                    },
                    customClass: {
                        popup: 'rounded-3',
                        title: 'text-dark'
                    },
                    backdrop: `
                rgba(0,0,0,0.2)
                center top
                no-repeat
            `,
                    timer: 3000,
                    timerProgressBar: true
                });
                return false;
            }
            return true;
        } catch (error) {
            console.error(`检查${roleName}报名状态失败:`, error);
            await Swal.fire({
                title: '系统提示',
                text: '暂时无法获取报名状态，请稍后再试',
                icon: 'warning',
                confirmButtonText: '好的',
                confirmButtonColor: '#6c757d',
                background: '#f8f9fa',
                showClass: {
                    popup: 'animate__animated animate__fadeIn'
                }
            });
            return false;
        }
    }

    async function checkAndShowDeadlineReminder() {
        let currentRole = "精益学员";
        try {
            const {status, deadline} = await signUpStatus(currentRole);
            await updateDeadlineAlert(currentRole, 'signUp', status, deadline);
        } catch (error) {
            console.error('检查截止时间失败:', error);
        }
    }

    // 更新截止时间提醒UI
    async function updateDeadlineAlert(role, checkType, status, deadline) {
        const alertBar = document.getElementById('statusAlertBar');
        if (!alertBar) return;

        if (status === 1 && deadline) {
            const deadlineDate = new Date(deadline);
            const timeLeft = deadlineDate - new Date();
            const daysLeft = Math.ceil(timeLeft / (1000 * 60 * 60 * 24));

            // 设置提醒内容
            document.getElementById('statusAlertTitle').textContent =
                `${role} ${checkType === 'signUp' ? '报名' : '考试申请'}进行中`;
            document.getElementById('statusAlertContent').innerHTML = `
            <div>截止时间: ${deadlineDate.toLocaleString()}</div>
            <div class="fw-bold mt-1">剩余时间: ${daysLeft}天</div>
        `;

            // 根据紧急程度设置样式
            const alertClasses = {
                icon: 'bi-info-circle-fill',
                bar: 'alert-info'
            };

            if (daysLeft <= 3) {
                alertClasses.icon = 'bi-exclamation-triangle-fill';
                alertClasses.bar = 'alert-danger';
                if (daysLeft > 0) {
                    showUrgentReminder("精益学员", 'signUp', deadlineDate, daysLeft);
                } else {
                    checkSignUpStatus("精益学员");
                }
            } else if (daysLeft <= 7) {
                alertClasses.icon = 'bi-exclamation-circle-fill';
                alertClasses.bar = 'alert-warning';
            }

            alertBar.className = `alert ${alertClasses.bar} alert-dismissible fade show mb-4`;
            document.getElementById('statusAlertIcon').className = `bi ${alertClasses.icon} me-3 fs-4`;
            alertBar.style.display = 'block';
        } else {
            alertBar.style.display = 'none';
        }
    }

    // 显示紧急提醒弹窗
    function showUrgentReminder(role, type, deadlineDate, daysLeft) {
        Swal.fire({
            title: `${role} ${type === 'signUp' ? '报名' : '考试申请'}即将截止`,
            html: `
        <div style="text-align: left; margin: 1rem 0; color: #555;">
            <div class="mb-2">
                <i class="bi bi-exclamation-triangle-fill" style="color: #dc3545; margin-right: 8px;"></i>
                <strong>剩余时间仅剩 ${daysLeft} 天!</strong>
            </div>
            <div class="mb-2">
                <i class="bi bi-calendar-x" style="margin-right: 8px;"></i>
                截止时间: ${deadlineDate.toLocaleString()}
            </div>
            <div class="small text-muted mt-2">
                请及时完成${type === 'signUp' ? '报名' : '考试申请'}，逾期将无法提交
            </div>
        </div>
        `,
            icon: 'warning',
            confirmButtonText: '立即处理',
            confirmButtonColor: '#dc3545',
            showCancelButton: true,
            cancelButtonText: '稍后再说',
            backdrop: `rgba(0, 0, 0, 0.4)`,
            allowOutsideClick: false
        }).then((result) => {
            if (result.isConfirmed) {
                highlightActionButton();
            }
        });
    }

    // 高亮操作按钮
    function highlightActionButton() {
        const button = domCache.signupButton;
        if (!button) return;

        button.scrollIntoView({behavior: 'smooth', block: 'center'});
        button.classList.add('pulse-animation');
        setTimeout(() => {
            button.classList.remove('pulse-animation');
        }, 3000);
    }


    document.addEventListener('DOMContentLoaded', async function () {
        showLoading(); // 立即显示遮罩层

        // 检查是否获取到userName
        var userRole = await loadUserRole(userName);

        if (!userName || userRole === 0 || /^00Q/i.test(userName)) {
            // 弹出提示并重定向到另一个页面
            alert("无权限访问，请退出。");
            window.location.href = "http://edi.sdstg.com/"; // 这里设置你的重定向URL
            return; // 确保后续的代码不再执行
        }

        const response = await loadList(userName);

        userFid = encodeURIComponent(userFid)
        if (response === null) {
            window.location.href = `sign_up.html?userName=${userFid}`;
            return; // 停止当前逻辑
        }

        await checkAndShowDeadlineReminder();

        const isOpen = await checkSignUpStatus("精益学员");
        if (!isOpen) return;

        // 数据加载完成后隐藏遮罩
        hideLoading();

        const homeLink = document.querySelector('.breadcrumb-item a'); // 选择面包屑的链接

        homeLink.href = `sign_up.html?userName=${encodeURIComponent(userFid)}`; // 如果 userName 存在，修改链接

        setAgreementLabel()
        const nextButton = document.getElementById('nextButton');
        document.getElementById('agreement').addEventListener('change', updateNextButtonState);

        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('click', function () {
                setActiveCard(this.id);
                updateNextButtonState();
            });
        });

        nextButton.addEventListener('click', function () {
            const activeCard = document.querySelector('.card.active');
            if (activeCard && !this.disabled) {
                const cardId = activeCard.id;
                window.location.href = `registration.html?cardId=${cardId}&userName=${userName}`;
            }

        });

        const headerImg = document.getElementById('header-img');
        headerImg.src = '../logo/font_logo2.png'; // 设置图片源
    });


    // 加载用户是否禁用
    async function loadUserRole(userName) {
        const response = await fetchDataFromAPI('690', userName);
        return response.data.status
    }

    // 加载开放状态
    async function signUpStatus(name) {
        const response = await fetchDataFromAPI('693', name);
        return {
            status: response.data.status,
            deadline: response.data.deadline || null
        };
    }


    function showLoading() {
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.add('loading-active');
        document.body.style.overflow = 'hidden';
    }

    function hideLoading() {
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.remove('loading-active');
        document.body.style.overflow = 'auto';
    }

    // 设置 label 的内容
    function setAgreementLabel() {
        const agreementLabel = document.getElementById('agreementLabel');
        const labelContent = `
                已阅读 <a href="lean_pdf.html?userName=${userName}" class="info-link" data-type="leanLeader">《精益认证工作细则》</a>
                并知悉要求
            `;

        // 使用 innerHTML 设置标签内容
        agreementLabel.innerHTML = labelContent;
    }

    async function loadList(userName) {
        const ua = navigator.userAgent.toLowerCase();
        const isMobile = /mobile|android|iphone|ipad|ipod/i.test(ua);
        const isTablet = /tablet|ipad/i.test(ua);
        // 1. 创建 device 对象
        const deviceObj = {
            type: isMobile ? '手机' : (isTablet ? '平板' : '电脑'),
            os: /windows/.test(ua) ? 'Windows' :
                /mac/.test(ua) ? 'macOS' :
                    /linux/.test(ua) ? 'Linux' :
                        /android/.test(ua) ? 'Android' :
                            /iphone|ipad/.test(ua) ? 'iOS' : 'Unknown',
            browser: /chrome/.test(ua) ? 'Chrome' :
                /firefox/.test(ua) ? 'Firefox' :
                    /safari/.test(ua) && !/chrome/.test(ua) ? 'Safari' :
                        /edg/.test(ua) ? 'Edge' : 'Other',
            screen: `${window.screen.width}x${window.screen.height}`,
            isTouch: 'ontouchstart' in window
        };

        // 2. 将对象转为 JSON 字符串
        const deviceString = JSON.stringify(deviceObj);

        const feedbackData = {
            userName: userName,
            source: "leanList",
            device: deviceString  // 传递字符串而不是对象
        };

        const response = await fetchDataFromAPI('662', feedbackData);

        const leanLeaderCard = document.getElementById('leanLeaderCard');
        const leanCoachCard = document.getElementById('leanCoachCard');
        const seniorCoachCard = document.getElementById('seniorCoachCard');

        var user_status;
        if (response.data.status === 0) {
            user = response.data.user;
            user_status = response.data.user_status;
            role = response.data.currentStage;
            userFid = response.data.fid ?? userName;

            document.getElementById('userName').textContent = response.data.user_name

            //已报名
            if (role) {
                return null; // 没有权限，返回 null
            } else {
                // 根据用户角色调用 disableCards 函数
                disableCards(user, user_status);
                return response; // 有权限，返回响应数据
            }

        } else {
            // 除学员卡之外的所有卡片不可选
            [leanLeaderCard, leanCoachCard, seniorCoachCard].forEach(card => {
                card.setAttribute('data-clickable', 'false');
                card.style.pointerEvents = 'none';
                card.style.opacity = '0.5';
            });
        }
    }

    function disableCards(flag, user_status) {
        const leanLeaderCard = document.getElementById('leanLeaderCard');
        const leanStudentCard = document.getElementById('leanStudentCard');
        const leanCoachCard = document.getElementById('leanCoachCard');
        const seniorCoachCard = document.getElementById('seniorCoachCard');

        // 首先将所有卡片设置为不可点击状态
        const cards = [leanStudentCard, leanLeaderCard, leanCoachCard, seniorCoachCard];
        cards.forEach(card => {
            card.setAttribute('data-clickable', 'false');
            card.style.pointerEvents = 'none';
            card.style.opacity = '0.5';
        });

        if (user_status) {

            // 根据 flag 值启用相应的卡片
            switch (flag.trim()) {
                case '精益学员':
                    leanStudentCard.setAttribute('data-clickable', 'true');
                    leanStudentCard.style.pointerEvents = 'auto';
                    leanStudentCard.style.opacity = '1';
                    break;
                case '精益骨干':
                    leanLeaderCard.setAttribute('data-clickable', 'true');
                    leanLeaderCard.style.pointerEvents = 'auto';
                    leanLeaderCard.style.opacity = '1';
                    break;
                case '精益教练':
                    leanCoachCard.setAttribute('data-clickable', 'true');
                    leanCoachCard.style.pointerEvents = 'auto';
                    leanCoachCard.style.opacity = '1';
                    break;
                case '资深教练':
                    seniorCoachCard.setAttribute('data-clickable', 'true');
                    seniorCoachCard.style.pointerEvents = 'auto';
                    seniorCoachCard.style.opacity = '1';
                    break;
                default:
                    // 不做任何事情，所有卡片保持不可点击
                    break;
            }
        }
    }

    function updateNextButtonState() {
        const nextButton = document.getElementById('nextButton');
        const agreementChecked = document.getElementById('agreement').checked;
        const activeCard = document.querySelector('.card.active');
        nextButton.disabled = !(agreementChecked && activeCard);
    }

    function setActiveLink(activeTab) {
        const tabs = ['recommendation', 'business', 'process', 'system'];
        tabs.forEach(tab => {
            const link = document.getElementById(`pills-${tab}-tab`);
            const content = document.getElementById(`pills-${tab}`);
            if (tab === activeTab) {
                link.classList.add('active');
                content.classList.add('show', 'active');
            } else {
                link.classList.remove('active');
                content.classList.remove('show', 'active');
            }
        });
        const allCards = document.querySelectorAll('.card');
        allCards.forEach(card => {
            card.classList.remove('active');
        });
        window.scrollTo(0, 0);
    }

    function setActiveCard(activeCardId) {
        const allCards = document.querySelectorAll('.card');
        allCards.forEach(card => {
            card.classList.remove('active');
            const img = card.querySelector('img');
            if (img) {
                img.src = img.src.replace('_active', '_inactive'); // 替换为非激活状态图片
            }
        });

        const activeCard = document.getElementById(activeCardId);
        if (activeCard) {
            activeCard.classList.add('active');
            const img = activeCard.querySelector('img');
            if (img) {
                img.src = img.src.replace('_inactive', '_active'); // 替换为激活状态图片
            }
        }
    }
</script>
</body>

</html>
