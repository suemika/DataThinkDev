<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../vendor/logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<script src="../vendor/easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../util/html2canvas.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        /* 背景图片容器样式 */
        #background-container {
            background-image: url('png/zhengshu.png');
            background-size: 375px 667px;
            background-repeat: no-repeat;
            width: 375px;
            height: 667px;
            position: relative;
            font-family: "Microsoft YaHei", "宋体", serif;
        }

        /* 新增信息显示样式 */
        #name-display,
        #role-display,
        #year-display {
            position: relative;
            font-size: 16px;
        }

        #date-display {
            position: relative;
            font-size: 14px;
        }

        #name-display {
            top: 252px;
            left: 80px;
        }

        #role-display {
            top: 263px;
            left: 233px;
        }

        #year-display {
            top: 245px;
            left: 115px;
        }

        #date-display {
            top: 440px;
            left: 225px;
        }

        /* 保存按钮样式 */
        #save-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <title>认证证书</title>
</head>

<body>
<div id="background-container">
    <div id="name-display"></div>
    <div id="role-display"></div>
    <div id="year-display"></div>
    <div id="date-display"></div>
</div>
<button id="save-button">保存为图片</button>
<script>
    let userName = getNameFromUrl("userName");
    let tabRole = getNameFromUrl("tabRole");
    let user_role = null;
    let user_name = null;
    let user_year = null;
    let user_date = null;

    document.addEventListener("DOMContentLoaded", async function () {
        const {
            user_role: loadedRole,
            user_name: loadedName,
            user_year: loadedYear,
            user_date: loadedDate
        } = await loadList(userName);
        user_role = tabRole;
        user_name = loadedName;
        user_year = loadedYear;
        user_date = loadedDate;

        // 将获取到的数据显示在页面上
        document.getElementById('name-display').textContent = `${user_name}`;
        document.getElementById('role-display').textContent = `${user_role}`;
        document.getElementById('year-display').textContent = `${user_year}`;
        document.getElementById('date-display').textContent = `${user_date}`;
    });

    function getNameFromUrl(type) {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(type);
    }

    const saveButton = document.getElementById('save-button');
    // 使用 touchstart 事件
    saveButton.addEventListener('touchstart', function () {
        // 隐藏保存按钮
        saveButton.style.display = 'none';
        html2canvas(document.getElementById('background-container')).then(function (canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'certificate.png';
            // 尝试模拟点击下载
            link.click();
            // 截图完成后显示保存按钮
            saveButton.style.display = 'block';
        }).catch((error) => {
            console.error('截图出错:', error);
            saveButton.style.display = 'block';
            // 提示用户手动下载
            alert('截图出错，请重试或手动下载。');
        });
    });

    async function loadList(userName) {
        const feedbackData = {
            workId: userName,
            roll: tabRole
        };

        const response = await fetchDataFromAPI('674', feedbackData);
        let user_name = null;
        let user_year = null;
        let user_date = null;
        if (response.data.status === 0) {
            user_name = response.data.user_name;
            user_year = response.data.user_year;
            user_date = response.data.user_date;
        }
        return {user_name, user_year, user_date};
    }

    async function fetchDataFromAPI(req, data) {
        try {
            const response = await axios.post('/imc/customOpt', {req, data: JSON.stringify(data)});
            return response.data;
        } catch (error) {
            console.error('请求出错:', error);
            return {data: {status: -1}};
        }
    }
</script>
</body>

</html>
