<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人自评表评价标准</title>
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../vendor/logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<link rel="stylesheet" href="../vendor/bootstrap5/css/bootstrap.min.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="../bootstrap-icons-1.11.3/font/bootstrap-icons.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="util/util.css?v=' + randomVersion + '">');
        document.write('<script src="../vendor/easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="vendor/util/util_link.js"?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/bootstrap5/js/bootstrap.bundle.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../vendor/elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-light: #eef2ff;
            --secondary-color: #007bff;
            --accent-color: #f72585;
            --success-color: #4cc9f0;
            --danger-color: #ef233c;
            --warning-color: #ff9e00;
            --light-bg: #f8f9fa;
            --dark-bg: #212529;
            --text-color: #2b2d42;
            --text-light: #8d99ae;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --background: linear-gradient(135deg, #f4f9ff 0%, #e0e9ff 100%);
        }


        .nav-style {
            margin: 1px auto 3rem auto;
            max-width: 800px;
            background-color: var(--background);
            width: calc(100% - 20px);
        }


        /* 面包屑导航 */
        .breadcrumb {
            background: var(--background);
            padding: 0.95rem 0.3rem;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
        }

        .breadcrumb-item a {
            color: var(--secondary-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
        }

        .breadcrumb-item a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .breadcrumb-item.active {
            color: var(--text-light);
            font-weight: 500;
        }

        /* 刷新按钮 */
        .btn-refresh {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.25rem;
            font-weight: 500;
            margin-bottom: 1rem;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(67, 97, 238, 0.2);
        }

        .btn-refresh:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }

        .btn-refresh i {
            margin-right: 0.5rem;
        }

        /* 列表项样式 */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            margin-bottom: 0.75rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-decoration: none;
            color: var(--text-color);
            border-left: 4px solid var(--primary-color);
        }

        .list-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            background-color: var(--primary-light);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 1.1rem;
        }

        .status-badge {
            padding: 0.25rem 0.45rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-unfilled {
            background-color: #ffebee;
            color: var(--danger-color);
        }

        .status-filled {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .arrow-icon {
            color: var(--text-light);
            margin-left: 1rem;
            transition: var(--transition);
        }

        .list-item:hover .arrow-icon {
            color: var(--primary-color);
            transform: translateX(3px);
        }

        /* 错误提示 */
        .alert-error {
            background-color: #ffebee;
            color: var(--danger-color);
            border: none;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 2px 8px rgba(239, 35, 60, 0.1);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                border-radius: 8px;
            }

            .list-item {
                padding: 0.75rem 1rem;
            }

            .list-item-title {
                font-size: 1rem;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .list-item {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 为每个列表项添加延迟动画 */
        .list-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .list-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .list-item:nth-child(3) {
            animation-delay: 0.3s;
        }

        .list-item:nth-child(4) {
            animation-delay: 0.4s;
        }

        .list-item:nth-child(5) {
            animation-delay: 0.5s;
        }

        i {
            margin-right: 8px;
        }
    </style>
</head>


<body class="poppins-bold">

<!-- 遮罩层 -->
<div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">

        <div class="diamond-loader">
            <!-- 静态阴影 -->
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
        </div>
        <div class="shadow"></div>
        <p class="mt-3">正在加载，请稍候...</p>
    </div>
</div>
<header class="background-container text-center">
    <img id="header-img" src="" alt="ST" style="height: 60px;">
</header>
<div class="user-name"><span id="userName"></span></div>
<nav aria-label="面包屑导航" class="nav-style">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="lean_list.html"><i class="bi bi-house-door"></i>认证阶段</a></li>
        <li class="breadcrumb-item active"><i class="bi bi-file-earmark-text"></i>个人自评表</li>
    </ol>
</nav>

<main class="container_main" id="mainContent">
    <button class="btn btn-refresh" onclick="location.reload()">
        <i class="bi bi-arrow-clockwise"></i>刷新
    </button>

    <div id="errorAlert" class="alert alert-error d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorMessage"></span>
    </div>

    <div class="list-group" id="achievementLinks"></div>
</main>

<script>
    const userFID = getNameFromUrl("userName");
    const role = getNameFromUrl("role");
    const redirectURL = `sign_up.html?userName=${encodeURIComponent(userFID)}`;
    let status = null;
    let userName = null;

    // 从后端 API 获取链接名称
    async function loadList() {

        await getUserInfo(userFID);

        const feedbackData = {
            workId: userName,
            role: role
        };

        try {
            const response = await fetchDataFromAPI('680', feedbackData);
            if (response.data.status === 0) {
                return response.data.data;
            }
            throw new Error('数据加载失败');
        } catch (error) {
            console.error('加载数据时出错:', error);
            showMsg('加载数据失败，请稍后重试');
            return null;
        }
    }

    async function getUserInfo(userFID) {

        const feedbackData = {
            userName: userFID,
            role: role,
            type: 1
        };

        const response = await fetchDataFromAPI('759', feedbackData);


        if (response.data.status === 0) {
            status = response.data.user_status;
            userName = response.data.userNumber;
            document.getElementById('userName').textContent = response.data.user_name
        }
    }


    // 动态生成链接
    function renderData(data) {
        const container = document.getElementById("achievementLinks");
        container.innerHTML = ''; // 清空容器

        if (!data || data.length === 0) {
            showMsg('暂无自评表数据');
            return;
        }

        data.forEach((item, index) => {
            const link = document.createElement("a");
            link.href = `selfAssessment.html?p=${item.id}&userName=${encodeURIComponent(userFID)}&role=${role}`;
            link.className = "list-item";

            // 根据状态设置样式
            const isFilled = item.into_status !== "未填写";
            const statusClass = isFilled ? "status-filled" : "status-unfilled";
            const statusText = item.into;

            link.innerHTML = `
                <div class="list-item-content">
                    <div class="list-item-title">${item.name}</div>
                </div>
                <div class="d-flex align-items-center">
                    <span class="status-badge ${statusClass} ">
                        <i class="bi ${isFilled ? 'bi-check-circle' : 'bi-exclamation-circle'}"></i> ${statusText}
                    </span>
                    <i class="bi bi-chevron-right arrow-icon"></i>
                </div>
            `;

            container.appendChild(link);
        });
    }

    document.addEventListener('DOMContentLoaded', async function () {
        // 先显示加载层
        util.loading.show();

        if (userFID === null) {
            window.location.href = "http://edi.sdstg.com/";
            return;
        }

        // 更新面包屑导航链接
        const homeLink = document.querySelector('.breadcrumb-item a');
        homeLink.href = redirectURL;

        const list = await loadList().finally(() => {
            // 无论成功失败都隐藏加载层
            util.loading.hide();
        });

        if (list) {
            renderData(list);
        }

    });
</script>
</body>
</html>
