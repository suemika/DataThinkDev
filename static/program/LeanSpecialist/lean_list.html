        .details ul {
            padding-left: 20px;

        .details li {

            font-size: 15px;

        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #eaeaea;
        }

        .contact-info p {
            color: #777;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .contact-email {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .contact-email:hover {
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
