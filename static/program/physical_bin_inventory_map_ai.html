<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理系统</title>
    <link rel="stylesheet" href="vendor/bootstrap5/css/bootstrap.css">
    <script src="vendor/elementui/js/jquery-3.7.0.min.js"></script>
    <script src="vendor/bootstrap5/js/bootstrap.js"></script>
    <style>
        .card {
            margin-bottom: 20px;
        }

        .warehouse-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .warehouse-slot {
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 120px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s, border 0.3s, transform 0.3s;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95); /* 默认缩小 */
        }

        .slot-info {
            position: absolute;
            bottom: 35px;
            left: 5px;
            font-weight: bold;
            color: #333;
            z-index: 1;
        }

        .stock-background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            transition: background-color 0.3s;
        }

        .progress-container {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .stock-progress {
            height: 100%;
            border-radius: 5px;
            width: 0;
            transition: width 0.5s;
        }

        /* 选中和未选中的样式调整 */
        .warehouse-slot.selected {
            transform: scale(1.1); /* 选中时放大 */
            z-index: 2; /* 放大时确保在上 */
            border: 2px solid #007bff; /* 选中时边框颜色 */
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3); /* 选中时增强阴影 */
        }

        /* 悬停时样式处理 */
        .warehouse-slot:not(.selected):hover {
            transform: scale(1.01); /* 悬停时稍微放大 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 悬停时阴影 */
        }
    </style>
</head>

<body>
<div class="container">
    <h1 class="text-center mt-4">库存状况监控</h1>
    <h2 class="text-center mt-4">料位图</h2>

    <div class="warehouse-layout">
        <div class="warehouse-slot" id="slot1" onclick="selectWarehouse(1)">
            <div class="slot-info">料位 1</div>
            <div class="stock-background" id="background1"></div>
        </div>
        <div class="warehouse-slot" id="slot2" onclick="selectWarehouse(2)">
            <div class="slot-info">料位 2</div>
            <div class="stock-background" id="background2"></div>
        </div>
        <div class="warehouse-slot" id="slot3" onclick="selectWarehouse(3)">
            <div class="slot-info">料位 3</div>
            <div class="stock-background" id="background3"></div>
        </div>
        <div class="warehouse-slot" id="slot4" onclick="selectWarehouse(4)">
            <div class="slot-info">料位 4</div>
            <div class="stock-background" id="background4"></div>
        </div>
    </div>

    <div id="inventoryInfo" class="row mt-4">
        <div class="col-md-4">
            <div class="card border-primary">
                <div class="card-header">
                    <h5 class="m-0">当前库存</h5>
                </div>
                <div class="card-body">
                    <h6 class="card-title text-primary" id="totalStock">1000 吨</h6>
                    <p class="card-text">当前选择料位的所有物资总数。</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-success">
                <div class="card-header">
                    <h5 class="m-0">可用库存</h5>
                </div>
                <div class="card-body">
                    <h6 class="card-title text-success" id="availableStock">750 吨</h6>
                    <p class="card-text">当前可以直接使用的库存量。</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-info">
                <div class="card-header">
                    <h5 class="m-0">库存利用率</h5>
                </div>
                <div class="card-body">
                    <div class="progress-container">
                        <div class="progress stock-progress" id="utilizationBar" role="progressbar"></div>
                    </div>
                    <h6 class="card-title text-info" id="utilizationRate">75%</h6>
                    <p class="card-text">当前库存的利用率。</p>
                </div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="amount">入库/出库数量:</label>
        <input type="number" class="form-control" id="amount" value="0">
    </div>
    <div class="form-group">
        <label for="date">选择日期:</label>
        <input type="date" class="form-control" id="date">
    </div>
    <button class="btn btn-success" onclick="addStock()">入库</button>
    <button class="btn btn-danger" onclick="removeStock()">出库</button>

    <div class="table-responsive mt-4">
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
            <tr>
                <th>物资名称</th>
                <th>当前库存</th>
                <th>可用库存</th>
                <th>待入库</th>
                <th>备注</th>
            </tr>
            </thead>
            <tbody>
                <tr>
                    <td>炼焦煤 A</td>
                    <td id="stockA">500 吨</td>
                    <td id="availableA">300 吨</td>
                    <td id="pendingA">100 吨</td>
                    <td>良好</td>
                </tr>
                <tr>
                    <td>炼焦煤 B</td>
                    <td id="stockB">400 吨</td>
                    <td id="availableB">350 吨</td>
                    <td id="pendingB">50 吨</td>
                    <td>需补货</td>
                </tr>
                <tr>
                    <td>炼焦煤 C</td>
                    <td id="stockC">100 吨</td>
                    <td id="availableC">100 吨</td>
                    <td id="pendingC">50 吨</td>
                    <td>低库存</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4" id="chart-container" style="height: 400px;"></div>
</div>

<script>
    const inventoryData = {
        1: { total: 1000, available: 750 },
        2: { total: 800, available: 600 },
        3: { total: 1200, available: 900 },
        4: { total: 700, available: 400 }
    };

    let currentWarehouse = 1;

    // 设置默认日期为今天
    function setDefaultDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById("date").value = today;
    }

    // 更新库存显示和背景颜色
    function updateStockDisplay(warehouseIndex) {
        const data = inventoryData[warehouseIndex];
        const utilizationRate = (data.available / data.total) * 100;
        document.getElementById("totalStock").innerText = data.total + ' 吨';
        document.getElementById("availableStock").innerText = data.available + ' 吨';
        document.getElementById("utilizationRate").innerText = utilizationRate.toFixed(2) + '%';

        const color = utilizationRate < 30 ? 'red' :
                      (utilizationRate < 70 ? 'lightblue' : 'lightgreen'); // 修改橙色为淡蓝色

        const backgroundElement = document.getElementById("background" + warehouseIndex);
        backgroundElement.style.backgroundColor = color;

        const utilizationBar = document.getElementById("utilizationBar");
        utilizationBar.style.width = utilizationRate + '%';
        utilizationBar.style.backgroundColor = color; // 确保进度条颜色匹配
    }

    // 选择料位，更新相关信息
    function selectWarehouse(warehouseIndex) {
        currentWarehouse = warehouseIndex;
        document.querySelectorAll('.warehouse-slot').forEach((slot, index) => {
            slot.classList.toggle('selected', index + 1 === currentWarehouse); // 选中样式
            slot.style.transform = index + 1 === currentWarehouse ? 'scale(1.1)' : 'scale(0.95)'; // 根据选中情况调整缩放
        });
        updateStockDisplay(warehouseIndex);
    }

    // 增加库存
    function addStock() {
        const amount = parseInt(document.getElementById("amount").value) || 0;
        if (amount <= 0) return;

        const data = inventoryData[currentWarehouse];
        data.total += amount;
        data.available += amount;

        selectWarehouse(currentWarehouse); // 更新状态
    }

    // 减少库存
    function removeStock() {
        let amount = parseInt(document.getElementById("amount").value) || 0;
        if (amount <= 0) return;

        const data = inventoryData[currentWarehouse];

        // 检查可用库存是否足够
        if (amount > data.available) {
            alert("出库数量超出可用库存！");
            return;
        }

        data.available -= amount;
        data.total -= amount;

        selectWarehouse(currentWarehouse); // 更新状态
    }

    // 初始化系统状态，包括设置默认日期和背景颜色
    function initializeSystem() {
        setDefaultDate();
        for (let i = 1; i <= 4; i++) {
            updateStockDisplay(i); // 初始化每个料位的显示
        }
        selectWarehouse(currentWarehouse);
    }

    initializeSystem(); // 启动初始化
</script>
</body>

</html>
