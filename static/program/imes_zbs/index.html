<body>

<!-- Loading -->
<div id="loading-overlay">
    <div class="loading-content">
        <div class="diamond-loader">
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
        </div>
        <p>正在加载，请稍候...</p>
    </div>
</div>

<header class="background-container">
    <img id="header-img" src="" alt="ST">
    <h2 class="h2-container">发货通知单台账</h2>
</header>

<main class="container">
    <div class="container-fluid px-0">

        <!-- 工具栏卡片 -->
        <div class="card" id="toolbar-card">
            <div class="card-header">
                <i class="bi bi-tools me-2"></i>查询与操作
            </div>
            <div class="card-body">
                <div class="toolbar-row">
                    <div class="toolbar-actions">
                        <button type="button" class="btn btn-primary" id="addBtn">
                            <i class="bi bi-plus-lg me-1"></i>新增
                        </button>
                        <button type="button" class="btn btn-secondary" id="refreshBtn">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                    </div>
                    <input type="text" class="form-control" id="search-box"
                           placeholder="输入发货通知单号、合同号、车号或规格，可模糊查询">
                    <div class="toolbar-actions">
                        <button type="button" class="btn btn-primary" id="searchBtn">
                            <i class="bi bi-search me-1"></i>查询
                        </button>
                        <button type="button" class="btn btn-secondary" id="clearBtn">
                            <i class="bi bi-x-circle me-1"></i>清除
                        </button>
                    </div>
                    <span id="search-result-hint"></span>
                </div>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card" id="table-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <i class="bi bi-card-checklist me-2"></i>数据列表
                </div>
                <div>
                    <span class="badge bg-primary" id="resultCount">0</span> 条记录
                </div>
            </div>

            <!-- 批量操作栏 -->
            <div class="batch-actions" id="batchActions" style="display:none;">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <div class="batch-info">
                        <div class="check-all-container">
                            <input type="checkbox" id="checkAll" class="form-check-input">
                            <label for="checkAll" class="form-check-label mb-0">全选</label>
                        </div>
                        <span>已选择 <span class="batch-count" id="selectedCount">0</span> 条</span>
                    </div>
                </div>
            </div>

            <div class="card-body p-0">
                <div class="table-container">
                    <table class="table table-hover" id="data-table">
                        <thead>
                        <tr>
                            <th scope="col" width="50">
                                <input type="checkbox" id="headerCheckbox" class="form-check-input">
                            </th>
                            <th scope="col" data-sort="发货通知单号">
                                发货通知单号 <i class="bi bi-arrow-down-up sort-icon"></i>
                            </th>
                            <th scope="col" data-sort="合同号">合同号</th>
                            <th scope="col" data-sort="批号">批号</th>
                            <th scope="col" data-sort="规格">规格</th>
                            <th scope="col" data-sort="牌号">牌号</th>
                            <th scope="col" data-sort="产品名称1">产品名称</th>
                            <th scope="col" data-sort="收货单位">收货单位</th>
                            <th scope="col" data-sort="车号">车号</th>
                            <th scope="col" data-sort="重量">重量</th>
                            <th scope="col" data-sort="日期">日期</th>
                            <th scope="col" width="165">操作</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                        <tr id="empty-state-row">
                            <td colspan="12" class="empty-state">
                                <i class="bi bi-inbox"></i>
                                <p class="mb-0">暂无数据</p>
                                <small>请点击"刷新"按钮加载数据，或点击"新增"添加记录</small>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 分页 -->
            <div class="pagination-wrapper" style="display:none;">
                <div class="pagination-info">
                    共 <strong id="total-count">0</strong> 条，
                    第 <strong id="current-page">1</strong> / <strong id="total-pages">1</strong> 页
                </div>
                <nav>
                    <ul class="pagination" id="pagination-nav"></ul>
                </nav>
                <div>
                    <select class="form-select" id="page-size-select" style="width:auto; display:inline;">
                        <option value="20">20条/页</option>
                        <option value="50" selected>50条/页</option>
                        <option value="100">100条/页</option>
                        <option value="200">200条/页</option>
                    </select>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- ==================== 审核确认 Modal ==================== -->
<div class="modal fade" id="auditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-check-circle me-2"></i>审核确认</h5>

            </div>

                <p>确认审核通过该记录？</p>
                <p class="text-muted" style="font-size:0.85rem;" id="audit-record-info"></p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>

</div>

    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header" style="background-color:#dc3545;">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>删除确认</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <p class="text-danger fw-bold">确认删除该记录？</p>
                <p class="text-muted" style="font-size:0.85rem;" id="delete-record-info"></p>
                <p class="text-muted" style="font-size:0.8rem;">此操作不可恢复！</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-1"></i>确认删除
                </button>
            </div>
        </div>
    </div>
</div>

</body>
