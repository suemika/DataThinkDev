<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Poppins:ital,wght@1;1&display=swap" rel="stylesheet">
    <style>

        .poppins-bold-italic {
            font-family: 'Poppins', sans-serif; /* 确保使用 Poppins 字体 */
            font-weight: 700; /* 粗体 */
            font-style: italic; /* 斜体 */
        }

    </style>
    <title>Poppins 字体示例</title>
</head>
<body>
    <h1 class="poppins-bold-italic">这是一个使用 Poppins 粗斜体的标题</h1>
    <p>这是一个普通的段落。</p>
</body>
</html>
