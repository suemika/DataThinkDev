<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石横特钢集团 | 电话查询</title>

    <script>
        (function(){
            var v = new Date().toISOString().slice(0,10).replace(/-/g,'');
            document.write('<link rel="icon" href="/logo.png?v='+v+'"  type="image/png">');
            document.write('<link rel="stylesheet" href="vendor/bootstrap5/css/bootstrap.css?v='+v+'">');
            document.write('<link rel="stylesheet" href="bootstrap-icons-1.11.3/font/bootstrap-icons.css?v='+v+'">');
            document.write('<link rel="stylesheet" href="./css/util.css?v='+v+'">');
            document.write('<link rel="stylesheet" href="./css/phone_lists.css?v='+v+'">');
            document.write('<script src="js/phone_lists.js?v='+v+'"><\/script>');
            document.write('<script src="js/util.js?v='+v+'"><\/script>');
            document.write('<script src="js/link_redirect_url.js?v='+v+'"><\/script>');
            document.write('<script src="vendor/elementui/js/jquery-3.7.0.min.js?v='+v+'"><\/script>');
            document.write('<script src="vendor/bootstrap5/js/bootstrap.bundle.min.js?v='+v+'"><\/script>');
            document.write('<script src="vendor/easyui/js-easyui/axios.min.js?v='+v+'"><\/script>');
        })();
    </script>
</head>
<body>
<!-- 遮罩层 -->
<div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
        <div class="diamond-loader">
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
        </div>
        <div class="shadow"></div>
        <p class="mt-3">正在加载，请稍候...</p>
    </div>
</div>

<header class="background-container">
    <a href="http://edi.sdstg.com/" target="_self" rel="noopener">
        <img id="header-img" src="" alt="ST" class="img-fluid">
    </a>
    <h2 class="h2-container"><i class="bi bi-telephone-fill me-2"></i>石横特钢集团有限公司电话查询</h2>
</header>

<nav aria-label="breadcrumb" class="container-nav">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="http://edi.sdstg.com/"><i class="bi bi-house-door me-1"></i>首页</a></li>
        <li class="breadcrumb-item active"><i class="bi bi-telephone me-1"></i>电话查询</li>
    </ol>
</nav>

<main id="main-content">
    <!-- 搜索区 -->
    <div class="search-card">
        <div class="input-group-t">
            <input type="text" id="search-box" class="form-control shadow-sm"
                   placeholder="支持姓名简拼(如:zs-张三)、模糊查询(搜索姓名中的任意部分)">
            <button type="button" id="submitBtn" class="btn btn-primary shadow-sm">
                <i class="bi bi-search"></i>
            </button>
        </div>
        <div class="dial-tip">
            <i class="bi bi-telephone-outbound"></i>使用手机拨打<span>"8"</span>开头座机时，请在号码前加拨<span>"512"</span>
        </div>
    </div>

    <!-- 部门 & 表格区 -->
    <div id="department-wrapper" class="d-flex flex-column align-items-center">
        <div id="department-buttons" class="d-flex flex-wrap justify-content-center mb-4">
            <!-- 部门按钮动态生成 -->
        </div>
        <div id="table-container" class="w-100">
            <!-- 表格动态生成 -->
        </div>
        <div id="no-data-message" class="alert alert-info shadow-sm" style="display: none;">
            <i class="bi bi-info-circle me-2"></i>无匹配数据
        </div>
    </div>
</main>

<!-- 错误提示（redirectToErrorPage 使用，必须在 main 外面避免被 showErrorMessage 隐藏） -->
<div id="error-message" style="display: none;">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    非法访问，<span id="countdown-timer">20</span> 秒后跳转到首页
</div>

</body>
</html>
