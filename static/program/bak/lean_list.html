<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精益认证报名</title>
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../../logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<link rel="stylesheet" href="../../bootstrap5/css/bootstrap.min.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="util/util.css?v=' + randomVersion + '">');
        document.write('<script src="../../easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../util/util_link.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../../bootstrap5/js/bootstrap.bundle.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../../elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        /* 其他 CSS 保持不变 */
        .container {
            display: flex;
            flex-direction: column;
            min-height: 68vh;
            margin: 0 auto;
            padding: 15px;
        }

        .row {
            display: flex;
            /* 使用 Flexbox 布局 */
            flex: 1;
            /* 使内容区域自适应 */
            flex-wrap: nowrap;
            /* 不换行，保持一行显示 */
        }

        .sidebar {
            text-align: center;
            flex: 0 0 25%;
            /* 设置侧边栏的固定宽度 */
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            /* 给侧边栏内边距 */
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            border-radius: 15px 0 0 15px;
            overflow-y: auto;
            /* 如果内容超过边栏高度，显示滚动条 */
        }

        .sidebar .nav-link {
            color: #333;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .sidebar .nav-link.active {
            background: #007bff;
            color: #fff;
        }

        .sidebar .nav-link:hover {
            background: #007bff;
            color: #fff;
        }

        .content {
            flex: 1;
            /* 自适应宽度 */
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 15px 15px 0;
            box-shadow: rgba(0, 0, 0, 0.1) 0 0 10px;
            overflow-y: auto;
            /* 如果内容超过，高度显示滚动条 */
        }

        .footer {
            margin-top: 8px;
            padding: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            text-align: center;
            width: 100%;
        }

        .btn-next {
            width: 80%;
            margin: 5px auto;
            border-radius: 20px;
            background: #007bff;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn-next:hover {
            background: #007bff;
            transform: scale(1.05);
        }

        /* 媒体查询 */
        @media (max-width: 768px) {
            .sidebar {
                flex: 0 0 25%;
                /* 在小屏幕上侧边栏占满一整行 */
                border-radius: 15px 0 0 15px;
            }

            .content {
                padding: 10px;
            }

            .btn-next {
                width: 95%;
                /* 调整按钮宽度 */
            }
        }

        @media (max-width: 576px) {
            .btn-next {
                width: 100%;
                /* 在超小屏幕上按钮宽度满屏 */
            }
        }

        /* 卡片样式 */
        .card {
            height: 50px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            /* 图片和文字并排显示 */
            align-items: center;
            /* 垂直对齐 */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card.active {
            background: #000;
            color: rgba(255, 255, 255, 0.9);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* 图片设置 */
        .card img {
            width: 40px;
            /* 固定图片宽度 */
            height: 30px;
            margin-left: 30px;
            /* 图片与文字之间的间距 */
            border-radius: 10px;
            /* 可选：为图片增加圆角 */
        }

        .card-body {
            flex: 1; /* 文字区域占用剩余空间 */
            text-align: left;
            margin-left: 15px; /* 取消外边距 */
            padding: 0; /* 取消内边距 */
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-text {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.7);
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1);
            /* 可调整透明度 */
            display: flex;
            /* 初始不显示 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            /* 确保遮罩层在顶部 */
        }

        .overlay-content {
            color: #fff;
            font-size: 24px;
        }

        /* 当加载时再显示遮罩层 */
        .loading {
            visibility: visible;
            /* 显示遮罩层 */
        }

        /* 为禁用状态添加样式 */
        .btn-next:disabled {
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            /* 半透明白色 */
            color: rgba(0, 0, 0, 0.5);
            /* 灰色文本 */
            cursor: not-allowed;
            /* 光标变为禁用状态 */
            transform: none;
            /* 禁用时去掉缩放效果 */
        }

    </style>
</head>

<body class="poppins-bold">
<div id="loading-overlay">
    <div class="overlay-content">
        <h2 class="poppins-bold-italic">加载中，请稍候...</h2>
    </div>
</div>

<header class="background-container">
    <img id="header-img" src="" alt="ST">
    <h2 class="poppins-bold-italic">精益认证平台</h2>
</header>
<nav aria-label="面包屑导航">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="lean_list.html">认证阶段</a></li>
        <li class="breadcrumb-item active">报名</li>
    </ol>
</nav>
<main>
    <div class="container">
        <div class="row no-gutters">
            <div class="sidebar">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" id="pills-recommendation-tab" data-toggle="pill"
                           href="#pills-recommendation" role="tab" onclick="setActiveLink('recommendation')">认证</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="pills-business-tab" data-toggle="pill" href="#pills-business" role="tab"
                           onclick="setActiveLink('business')">业务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="pills-process-tab" data-toggle="pill" href="#pills-process" role="tab"
                           onclick="setActiveLink('process')">流程</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="pills-system-tab" data-toggle="pill" href="#pills-system" role="tab"
                           onclick="setActiveLink('system')">体系</a>
                    </li>
                </ul>
            </div>
            <div class="content">
                <div class="tab-content" id="pills-tabContent">
                    <div class="tab-pane fade show active" id="pills-recommendation" role="tabpanel">
                        <div class="card d-flex flex-row align-items-center" id="leanStudentCard"
                             onclick="setActiveCard('leanStudentCard')">
                            <img src="png/student_inactive.svg" alt="精益学员">
                            <div class="card-body text-start">
                                <h5 class="card-title">精益学员</h5>
                            </div>
                        </div>

                        <div class="card d-flex flex-row align-items-center" id="leanLeaderCard"
                             onclick="setActiveCard('leanLeaderCard')">
                            <img src="png/leader_inactive.svg" alt="精益骨干">
                            <div class="card-body text-start">
                                <h5 class="card-title">精益骨干</h5>
                            </div>
                        </div>

                        <div class="card d-flex flex-row align-items-center" id="leanCoachCard"
                             onclick="setActiveCard('leanCoachCard')">
                            <img src="png/coach_inactive.svg" alt="精益教练">
                            <div class="card-body text-start">
                                <h5 class="card-title">精益教练</h5>
                            </div>
                        </div>

                        <div class="card d-flex flex-row align-items-center" id="seniorCoachCard"
                             onclick="setActiveCard('seniorCoachCard')">
                            <img src="png/senior_coach_inactive.svg" alt="资深教练">
                            <div class="card-body text-start">
                                <h5 class="card-title">资深教练</h5>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="pills-business" role="tabpanel">
                        <p class="text-center mt-4">—— 敬请期待 ——</p>
                    </div>
                    <div class="tab-pane fade" id="pills-process" role="tabpanel">
                        <p class="text-center mt-4">—— 敬请期待 ——</p>
                    </div>
                    <div class="tab-pane fade" id="pills-system" role="tabpanel">
                        <p class="text-center mt-4">—— 敬请期待 ——</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="agreement">
                <label class="form-check-label" for="agreement" id="agreementLabel">
                    已阅读 <a href="" class="info-link" data-type="leanLeader">《精益认证工作细则》</a>
                    并知悉要求
                </label>
            </div>
            <button type="button" class="btn btn-next" id="nextButton" disabled>下一步</button>
        </div>
    </div>
</main>

<script>

    const userName = getNameFromUrl("gzbh");
    let user;
    let role;

    const redirectURL = `sign_up.html?userName=${userName}`;

    document.addEventListener('DOMContentLoaded', async function () {
        showLoading(); // 立即显示遮罩层


        // 检查是否获取到userName
        var userRole = await loadUserRole(userName);


        if (!userName || userRole === 0) {
            // 弹出提示并重定向到另一个页面
            alert("无权限访问，请退出。");
            window.location.href = "http://edi.sdstg.com/"; // 这里设置你的重定向URL
            return; // 确保后续的代码不再执行
        }

        const response = await loadList(userName);

        if (response === null) {
            window.location.href = redirectURL;
            return; // 停止当前逻辑
        }

        // 检查是否开启
        var signUp_status = await signUpStatus("报名");

        if (signUp_status === 0) {
            // 弹出提示并重定向到另一个页面
            alert("报名已截至，请退出。");
            return;
        }

        // 数据加载完成后隐藏遮罩
        hideLoading();

        const homeLink = document.querySelector('.breadcrumb-item a'); // 选择面包屑的链接

        homeLink.href = redirectURL; // 如果 userName 存在，修改链接

        setAgreementLabel()
        const nextButton = document.getElementById('nextButton');
        document.getElementById('agreement').addEventListener('change', updateNextButtonState);

        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('click', function () {
                setActiveCard(this.id);
                updateNextButtonState();
            });
        });

        nextButton.addEventListener('click', function () {
            const activeCard = document.querySelector('.card.active');
            if (activeCard && !this.disabled) {
                const cardId = activeCard.id;
                window.location.href = `registration.html?cardId=${cardId}&userName=${userName}`;
            }

        });

        const headerImg = document.getElementById('header-img');
        headerImg.src = '../logo/font_logo2.png'; // 设置图片源
    });


    // 加载用户列表
    async function loadUserRole(userName) {
        const response = await fetchDataFromAPI('690', userName);
        return response.data.status
    }

    // 加载开放状态
    async function signUpStatus(name) {
        const response = await fetchDataFromAPI('693', name);
        return response.data.status
    }


    // 显示遮罩层
    function showLoading() {
        document.getElementById('loading-overlay').style.display = 'flex'; // 使用 flex 显示遮罩层
        document.body.style.overflow = 'hidden'; // 隐藏整个页面滚动条
        document.body.style.visibility = 'hidden'; // 隐藏整个页面内容
    }

    // 隐藏遮罩层
    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none'; // 隐藏遮罩层
        document.body.style.overflow = 'auto'; // 恢复页面滚动条
        document.body.style.visibility = 'visible'; // 显示整个页面内容
    }

    // 设置 label 的内容
    function setAgreementLabel() {
        const agreementLabel = document.getElementById('agreementLabel');
        const labelContent = `
                已阅读 <a href="lean_pdf.html?userName=${userName}" class="info-link" data-type="leanLeader">《精益认证工作细则》</a>
                并知悉要求
            `;

        // 使用 innerHTML 设置标签内容
        agreementLabel.innerHTML = labelContent;
    }

    async function loadList(userName) {
        const response = await fetchDataFromAPI('662', userName);

        const leanLeaderCard = document.getElementById('leanLeaderCard');
        const leanCoachCard = document.getElementById('leanCoachCard');
        const seniorCoachCard = document.getElementById('seniorCoachCard');

        var user_status;
        if (response.data.status === 0) {
            user = response.data.user;
            user_status = response.data.user_status;
            role = response.data.role;

            //已报名
            if (role === "无") {
                return null; // 没有权限，返回 null
            } else {
                // 根据用户角色调用 disableCards 函数
                disableCards(user, user_status);
                return response; // 有权限，返回响应数据
            }
        } else {
            // 除学员卡之外的所有卡片不可选
            [leanLeaderCard, leanCoachCard, seniorCoachCard].forEach(card => {
                card.setAttribute('data-clickable', 'false');
                card.style.pointerEvents = 'none';
                card.style.opacity = '0.5';
            });
        }
    }

    function disableCards(flag, user_status) {
        const leanLeaderCard = document.getElementById('leanLeaderCard');
        const leanStudentCard = document.getElementById('leanStudentCard');
        const leanCoachCard = document.getElementById('leanCoachCard');
        const seniorCoachCard = document.getElementById('seniorCoachCard');

        // 首先将所有卡片设置为不可点击状态
        const cards = [leanLeaderCard, leanStudentCard, leanCoachCard, seniorCoachCard];
        cards.forEach(card => {
            card.setAttribute('data-clickable', 'false');
            card.style.pointerEvents = 'none';
            card.style.opacity = '0.5';
        });

        if (user_status) {

            // 根据 flag 值启用相应的卡片
            switch (flag.trim()) {
                case '精益学员':
                    leanLeaderCard.setAttribute('data-clickable', 'true');
                    leanLeaderCard.style.pointerEvents = 'auto';
                    leanLeaderCard.style.opacity = '1';
                    break;
                case '精益骨干':
                    leanStudentCard.setAttribute('data-clickable', 'true');
                    leanStudentCard.style.pointerEvents = 'auto';
                    leanStudentCard.style.opacity = '1';
                    break;
                case '精益教练':
                    leanStudentCard.setAttribute('data-clickable', 'true');
                    leanStudentCard.style.pointerEvents = 'auto';
                    leanStudentCard.style.opacity = '1';
                    break;
                case '资深教练':
                    leanStudentCard.setAttribute('data-clickable', 'true');
                    leanStudentCard.style.pointerEvents = 'auto';
                    leanStudentCard.style.opacity = '1';
                    break;
                default:
                    // 不做任何事情，所有卡片保持不可点击
                    break;
            }
        }
    }

    function updateNextButtonState() {
        const nextButton = document.getElementById('nextButton');
        const agreementChecked = document.getElementById('agreement').checked;
        const activeCard = document.querySelector('.card.active');
        nextButton.disabled = !(agreementChecked && activeCard);
    }

    function setActiveLink(activeTab) {
        const tabs = ['recommendation', 'business', 'process', 'system'];
        tabs.forEach(tab => {
            const link = document.getElementById(`pills-${tab}-tab`);
            const content = document.getElementById(`pills-${tab}`);
            if (tab === activeTab) {
                link.classList.add('active');
                content.classList.add('show', 'active');
            } else {
                link.classList.remove('active');
                content.classList.remove('show', 'active');
            }
        });
        const allCards = document.querySelectorAll('.card');
        allCards.forEach(card => {
            card.classList.remove('active');
        });
        window.scrollTo(0, 0);
    }

    function setActiveCard(activeCardId) {
        const allCards = document.querySelectorAll('.card');
        allCards.forEach(card => {
            card.classList.remove('active');
            const img = card.querySelector('img');
            if (img) {
                img.src = img.src.replace('_active', '_inactive'); // 替换为非激活状态图片
            }
        });

        const activeCard = document.getElementById(activeCardId);
        if (activeCard) {
            activeCard.classList.add('active');
            const img = activeCard.querySelector('img');
            if (img) {
                img.src = img.src.replace('_inactive', '_active'); // 替换为激活状态图片
            }
        }
    }
</script>
</body>

</html>
