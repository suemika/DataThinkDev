<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发任务概况</title>
    <!-- 设置网站图标 -->
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="../../bootstrap5/css/bootstrap.css">

    <style>
        /* 添加样式以美化背景颜色 */
        .data-field {
            background-color: #d3eafd;
            padding: 8px;
            margin: 4px;
            border-radius: 4px;
        }

        /* 移除容器的最大宽度限制 */
        body, html {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* 防止水平滚动条出现 */
        }

        body {
            margin-top: 0px; /* 调整为适当的值，以增加顶部外边距 */
        }

        .col-md-6 {
            width: 100%;
        }

        ul {
            margin: 0; /* 或其他适当的值 */
        }

        /* 图表容器的最小高度 */
        #echartsContainer {
            min-height: 300px;
        }

        /* 分页样式 */
        .pagination {
            justify-content: center;
            height: 35px;
        }

        #currentPage {
            padding: 0px;
        }

        /* 添加样式以美化每页显示数的选择框 */
        #pageSizeSelect {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            margin-right: 10px;
        }

        /* 更改总任务部分文字的背景颜色 */
        .total-tasks {
            background-color: #cbe7ff; /* 更改为你喜欢的颜色 */
        }

        .total-hours {
            background-color: #cbe7ff; /* 更改为你喜欢的颜色 */
        }

        .completed-tasks {
            background-color: #cbe7ff; /* 更改为你喜欢的颜色 */
        }

        .completed-hours {
            background-color: #cbe7ff; /* 更改为你喜欢的颜色 */
        }

        .in-progress-hours {
            background-color: #cbe7ff; /* 更改为你喜欢的颜色 */
        }

        /* 其他样式保持不变 */

        /* 更改个人任务部分文字的背景颜色 */
        .personal-tasks {
            background-color: #c1e1c5; /* 更改为你喜欢的颜色 */
        }

        .personal-hours {
            background-color: #c1e1c5; /* 更改为你喜欢的颜色 */
        }

        .personal-completed-tasks {
            background-color: #c1e1c5; /* 更改为你喜欢的颜色 */
        }

        .personal-completed-hours {
            background-color: #c1e1c5; /* 更改为你喜欢的颜色 */
        }

        .personal-in-progress-hours {
            background-color: #c1e1c5; /* 更改为你喜欢的颜色 */
        }

        /* 根据任务状态设置不同的背景颜色 */
        .in-progress {
            background-color: #ffcccb; /* 进行中的背景颜色 */
        }

        .completed {
            background-color: #c1e1c5; /* 已完成的背景颜色 */
        }

        .row {
            display: flex;
        }

        .col-md-6 {
            flex: 1;
            margin: 0 8px; /* 可根据需要调整间距 */
        }

    </style>
</head>
<body>

<div class="row">
    <div class="col-12">
        <!-- Bootstrap Card -->
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 total-tasks-section">
                        <div class="d-flex flex-wrap">
                            <!-- Display Data - First Row -->
                            <p id="totalTasks" class="data-field total-tasks">总任务数：加载中...</p>
                            <p id="totalHours" class="data-field total-hours">总工时：加载中...</p>
                            <p id="completedTasks" class="data-field completed-tasks">已完成任务数：加载中...</p>
                            <p id="completedHours" class="data-field completed-hours">已完成工时：加载中...</p>
                            <p id="inProgressHours" class="data-field in-progress-hours">在开发工时：加载中...</p>
                        </div>
                    </div>
                    <div class="col-md-6 personal-tasks-section">
                        <div class="d-flex flex-wrap">
                            <!-- Display Data - Second Row -->
                            <p id="personalTasks" class="data-field personal-tasks">个人任务数：加载中...</p>
                            <p id="personalHours" class="data-field personal-hours">个人工时：加载中...</p>
                            <p id="personalCompletedTasks" class="data-field personal-completed-tasks">
                                个人已完成任务数：加载中...</p>
                            <p id="personalCompletedHours" class="data-field personal-completed-hours">
                                个人已完成工时：加载中...</p>
                            <p id="personalInProgressHours" class="data-field personal-in-progress-hours">
                                个人在开发工时：加载中...</p>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 total-tasks-section">
                        <!-- 柱状图容器 -->
                        <div id="echartsContainer" style="height: 300px;"></div>
                    </div>
                    <div class="col-md-6 personal-tasks-section">
                        <!-- 饼形图容器 -->
                        <div id="pieChartContainer" style="height: 300px;"></div>
                    </div>
                </div>

                <!-- Display Data Table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped text-center">
                        <!-- Table will be inserted here -->
                    </table>
                </div>

                <!-- Display Data Table Controls -->
                <div class="d-flex justify-content-center">
                    <div>
                        <label for="pageSizeSelect">每页显示数：</label>
                        <select id="pageSizeSelect" onchange="changePageSize()">
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <div>
                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="pagination justify-content-center">
                            <ul class="pagination">
                                <li class="page-item">
                                    <a class="page-link" href="#" onclick="changePage('prev')">上一页</a>
                                </li>
                                <li class="page-item">
                                    <span id="currentPage" class="page-link"></span>
                                </li>
                                <li class="page-item">
                                    <a class="page-link" href="#" onclick="changePage('next')">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../../bootstrap5/js/bootstrap.js"></script>
<script src="../../echarts/echarts.js"></script>
<script src="../../elementui/js/jquery-3.7.0.min.js"></script>
<script src="../../elementui/js/vue.js"></script>
<script src="../../easyui/js-easyui/axios.min.js"></script>
<script src="../../easyui/js-easyui/index.js"></script>
<script>
    let currentPage = 1;  // 当前页数
    let pageSize = 5;     // 每页显示数量
    let totalPages = 2;
    // 映射后的列名，按照你希望的顺序排列
    const columnMapping = {
        "序号": "序号",
        "任务名称": "任务名称",
        "提报单位": "提报单位",
        "提报人": "提报人",
        "任务类别": "任务类别",
        "任务来源": "任务来源",
        "计划完成日期": "计划完成日期",
        "实际完成日期": "实际完成日期",
        "任务创建日期": "任务创建日期",
        "任务状态": "任务状态",
        "计划总工时": "计划总工时",
        "角色": "角色",
        "分配工时": "分配工时",
        "实际分配工时": "实际分配工时",
        "分工": "分工",
        "是否发起工时调整": "是否发起工时调整",
        "周进度情况": "周进度情况",
        "周完成工时": "周完成工时",
        "提交时间": "提交时间"
    };
    let allData; // 用于保存全部数据
    let personalTaskData; // 用于保存个人任务列表数据
    let pieChartData;
    // 页面加载时调用 fetchData
    fetchData();
    fetchPersonalTaskData(currentPage, pageSize);

    // 数据获取
    function fetchData() {
        // 发起 GET 请求获取数据
        axios.post('/imc/customOpt', {
            req: '384',
            data: {}
        })
            .then(function (response) {
                // console.log('响应数据:', response.data.data);
                // 处理返回的数据
                const data = response.data.data.data;
                displayData(data);
            })
            .catch(function (error) {
                console.error('Error fetching data:', error);
            });
    }

    function updatePersonalTaskData(page, size) {
        // 调用显示个人任务列表的函数
        displayPersonalTaskTable(personalTaskData, size, page);

        // 调用显示分页导航栏的函数
        displayPagination(personalTaskData.length);
    }

    function fetchPersonalTaskData(currentPage, pageSize) {
        axios.post('/imc/customOpt', {
            req: '385',
            data: {}
        })
            .then(function (response) {
                //console.log('响应数据:', response.data.data);
                // 处理返回的数据
                personalTaskData = response.data.data.data;
                // 调用显示个人任务列表的函数，并传递每页显示数量和当前页数
                updatePersonalTaskData(currentPage, pageSize);
            })
            .catch(function (error) {
                console.error('Error fetching personal task data:', error);
            });
    }

    // 显示个人任务列表的函数
    function displayPersonalTaskTable(data, pageSize, currentPage) {
        let columnName;
        const tableContainer = document.querySelector('.table');
        // 构建表头
        let tableHTML = '<thead><tr>';
        for (columnName in columnMapping) {
            tableHTML += '<th>' + columnMapping[columnName] + '</th>';
        }
        tableHTML += '</tr></thead>';
        // 构建表格内容
        tableHTML += '<tbody>';

        // 计算起始索引和结束索引
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, data.length);

        // 显示当前页数据
        for (let i = startIndex; i < endIndex; i++) {
            // 根据任务状态添加相应的类
            const statusClass = data[i]["任务状态"] === "进行中" ? "in-progress" : data[i]["任务状态"] === "已完成" ? "completed" : "";

            tableHTML += '<tr class="' + statusClass + '">';
            for (columnName in columnMapping) {
                tableHTML += '<td>' + data[i][columnName] + '</td>';
            }
            tableHTML += '</tr>';
        }

        tableHTML += '</tbody>';
        // 将表格插入到页面中
        tableContainer.innerHTML = tableHTML;
    }


    // 显示分页导航栏的函数
    function displayPagination(totalItems) {
        totalPages = Math.ceil(totalItems / pageSize);
        let paginationHTML = '<ul class="pagination">';

        for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
                paginationHTML += '<li class="page-item active"><a class="page-link" href="#" onclick="changePageNumber(' + i + ')">' + i + '</a></li>';
            } else {
                paginationHTML += '<li class="page-item"><a class="page-link" href="#" onclick="changePageNumber(' + i + ')">' + i + '</a></li>';
            }
        }

        paginationHTML += '</ul>';

        $('#currentPage').html(paginationHTML);
    }

    // 每页显示数量变化时的回调函数
    function changePageSize() {
        // 更新每页显示数量
        pageSize = parseInt($('#pageSizeSelect').val()); // 解析为整数
        totalPages = Math.ceil(personalTaskData.length / pageSize); // 更新总页数
        currentPage = 1;
        // 重新获取数据
        updatePersonalTaskData(currentPage, pageSize);
    }

    // 更新 changePage 函数，确保能够处理数字页码的点击跳转
    function changePageNumber(pageNumber) {
        // 更新当前页数
        currentPage = pageNumber;
        // 重新获取数据
        updatePersonalTaskData(currentPage, pageSize);
    }

    // 切换页面时的回调函数
    function changePage(direction) {
        if (direction === 'prev' && currentPage > 1) {
            currentPage--;
        } else if (direction === 'next') {
            // 检查是否已经到达最后一页
            if (currentPage < totalPages) {
                currentPage++;
            }
        }
        // 重新获取数据
        updatePersonalTaskData(currentPage, pageSize);
    }

    // 处理数据的函数
    function displayData(data) {
        // 更新页面文本内容
        $('#totalTasks').html('科室总任务数：<span class="bold-text">' + data[0]["总任务数"] + '</span>');
        $('#totalHours').html('总工时：<span class="bold-text">' + data[0]["总工时"] + '</span>');
        $('#completedTasks').html('已完成任务数：<span class="bold-text">' + data[0]["总完成任务数"] + '</span>');
        $('#completedHours').html('已完成工时：<span class="bold-text">' + data[0]["总完成工时"] + '</span>');
        $('#inProgressHours').html('在开发工时：<span class="bold-text">' + data[0]["总在开发工时"] + '</span>');
        $('#personalTasks').html('个人任务数：<span class="bold-text">' + data[0]["个人任务数"] + '</span>');
        $('#personalHours').html('个人工时：<span class="bold-text">' + data[0]["个人工时"] + '</span>');
        $('#personalCompletedTasks').html('个人已完成任务数：<span class="bold-text">' + data[0]["已完成任务数"] + '</span>');
        $('#personalCompletedHours').html('个人已完成工时：<span class="bold-text">' + data[0]["已完成工时"] + '</span>');
        $('#personalInProgressHours').html('个人在开发工时：<span class="bold-text">' + data[0]["在开发工时"] + '</span>');

        // 更新 ECharts 图表
        const echartsContainer = document.getElementById('echartsContainer');
        const myChart = echarts.init(echartsContainer);

        const options = {
            title: {
                text: '月度研发任务概况'
            },
            tooltip: {},
            legend: {
                data: ['汇总', '个人'],
            },
            xAxis: {
                data: ['任务数', '工时', '已完成任务数', '已完成工时', '在开发工时']
            },
            yAxis: {},
            series: [{
                name: '汇总',
                type: 'bar',
                barWidth: 40, // 设置柱子宽度
                data: [
                    data[0].总任务数,
                    data[0].总工时,
                    data[0].总完成任务数,
                    data[0].总完成工时,
                    data[0].总在开发工时
                ],
                itemStyle: {
                    color: '#61a0a8' // 设置总任务的柱状图颜色
                },
                label: {
                    show: true, // 显示标签
                    position: 'top', // 标签位置
                    color: 'black', // 标签文字颜色
                    formatter: function (params) {
                        return params.value; // 显示具体数值
                    }
                }
            }, {
                name: '个人',
                type: 'bar',
                barWidth: 40, // 设置柱子宽度
                data: [
                    data[0].个人任务数,
                    data[0].个人工时,
                    data[0].已完成任务数,
                    data[0].已完成工时,
                    data[0].在开发工时
                ],
                itemStyle: {
                    color: '#f2a646' // 设置个人任务的柱状图颜色
                },
                label: {
                    show: true, // 显示标签
                    position: 'top', // 标签位置
                    color: 'black', // 标签文字颜色
                    formatter: function (params) {
                        return params.value; // 显示具体数值
                    }
                }
            }]
        };

        myChart.setOption(options);

        // 监听柱状图点击事件
        myChart.on('click', function (params) {

            // 根据点击的是任务数、工时、已完成任务数、已完成工时还是在开发工时，选择要显示的详细数据字段
            const detailFieldName = ['任务数', '工时', '已完成任务数', '已完成工时', '在开发工时'][params.dataIndex];

            // 在 pieChartData 中找到对应的详细数据
            const clickedDetailData = pieChartData.map(item => ({
                姓名: item['姓名'],
                [detailFieldName]: item[detailFieldName]
            }));

            // 更新饼状图数据
            updatePieChart(clickedDetailData);
        });
        // 监听窗口大小变化事件，调整图表大小
        window.addEventListener('resize', function () {
            myChart.resize();
        });
    }

    // 定义一个函数，用于更新饼状图数据
    function updatePieChart(data) {
        const pieChart = echarts.init(document.getElementById('pieChartContainer'));
        // 提取传入数据的字段名作为图例
        const legendData = Object.keys(data[0]);
        const pieOptions = {
            title: {
                text: legendData[1],
                subtext: '点击柱状图触发更新',
                left: 'center'
            },
            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b} : {c} ({d}%)'
            },
            legend: {
                orient: 'vertical',
                left: 'left'
            },
            series: [
                {
                    name: '分布',
                    type: 'pie',
                    radius: '55%',
                    center: ['50%', '60%'],
                    data: data.map(item => ({
                        value: item[legendData[1]],
                        name: item[legendData[0]]
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }
            ]
        };

        pieChart.setOption(pieOptions);
    }

    // 新增获取饼状图数据的函数
    function fetchPieChartData() {
        axios.post('/imc/customOpt', {
            req: '386',
            data: {}
        })
            .then(function (response) {
                // 处理返回的数据
                pieChartData = response.data.data.data;
                // 调用显示饼状图的函数
                displayPieChart(pieChartData);
            })
            .catch(function (error) {
                console.error('Error fetching pie chart data:', error);
            });
    }

    // 调用获取饼状图数据的函数
    fetchPieChartData();

    // 新增显示饼状图的函数
    function displayPieChart(pieChartData) {
        const pieChartContainer = document.getElementById('pieChartContainer');
        const pieChart = echarts.init(pieChartContainer);

        const options = {

            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b}: {c} ({d}%)'
            },
            legend: {
                orient: 'vertical',
                left: 10,
                data: pieChartData.map(item => item['姓名'])
            },
            series: [
                {
                    name: '个人工时',
                    type: 'pie',
                    radius: '50%',
                    center: ['50%', '60%'],
                    data: pieChartData.map(item => ({
                        name: item['姓名'],
                        value: item['工时']
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    },
                    label: {
                        show: true,
                        position: 'outer',
                        formatter: '{b}: {c} ({d}%)'
                    }
                }
            ]
        };

        pieChart.setOption(options);

        // 监听窗口大小变化事件，调整图表大小
        window.addEventListener('resize', function () {
            pieChart.resize();
        });
    }

</script>

</body>
</html>
