<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>精益认证节点</title>
    <script>
        const randomVersion = Math.random();
        document.write('<link rel="icon" href="../../logo.png?v=' + randomVersion + '" type="image/png">');
        document.write('<link rel="stylesheet" href="../../bootstrap5/css/bootstrap.min.css?v=' + randomVersion + '">');
        document.write('<link rel="stylesheet" href="util/util.css?v=' + randomVersion + '">');
        document.write('<script src="../../easyui/js-easyui/axios.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../util/util_link.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../../bootstrap5/js/bootstrap.bundle.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../../elementui/js/jquery-3.7.0.min.js?v=' + randomVersion + '"><\/script>');
        document.write('<script src="../js/popper.js?v=' + randomVersion + '"><\/script>');
    </script>
    <style>
        .timeline-container {
            position: relative;
        }

        .exam_time {
            font-size: 15px !important;
            font-weight: bold;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            margin: 10px;
        }

        .timeline-point {
            position: absolute;
            left: 8px;
            top: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            z-index: 1;
        }

        .timeline-point.completed {
            background-image: url('png/completed.svg');
            background-size: cover;
            background-position: center;
        }

        .timeline-point.in-progress {
            background-image: url('png/in-progress.svg');
            background-size: cover;
            background-position: center;
        }

        .timeline-point.pending {
            background-image: url('png/pending.svg');
            background-size: cover;
            background-position: center;
        }

        .content-card {
            flex: 1;
            background: #f4f9ff;
            border: 1px solid #dfeaf7;
            padding: 10px;
            border-radius: 15px;
            margin-left: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }

        .detail-card {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background-color: #007bff;
            color: #fff;
        }

        .content-card h6 {
            font-size: 14px;
        }

        .content-card p {
            font-size: 13px;
        }

        .detail-card p {
            margin: 5px 0;
        }

        .text-center {
            margin-top: 10px;
        }

        .nav-item {
            font-size: 16px;
        }

        .nav-pills {
            justify-content: center;

        }

        .nav-pills .nav-link {
            padding: 5px !important;
        }

        .nav-pills .nav-link.active {
            background: #007bff;
            color: #fff !important;
        }

        .custom-btn {
            background: #007bff;
            border: none;
            transition: background 0.3s ease;
            margin-bottom: 10px;
        }

        .custom-btn:hover {
            background: #007bff;
        }

        .badge-small {

            font-size: 12px !important;
            padding: 3px 6px !important;
            border-radius: 8px !important;
            height: 20px !important;
        }

        .mt-4 {
            margin-top: 2px !important;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .content-card {
                margin-left: 40px;
                background: linear-gradient(135deg, #f4f9ff 0%, #e0e9ff 100%);
            }

            .user-name {
                background-color: rgba(255, 255, 255, 0.5);
                font-size: 18px;
                border-radius: 10px;
                z-index: 1001;
            }
        }

        /* 自定义.user-name位置 */
        .user-name {
            position: absolute;
            top: 170px;
            right: 10px;
            margin-bottom: 5px;
        }

        .custom-btn:disabled {
            background-color: grey;
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
            border-color: grey;
        }

        #userName {
            padding: 5px;
            color: rgba(0, 0, 0, 0.5);
        }

        /* 自定义查看证书按钮样式 */
        .custom-certificate-btn {
            background: #007bff;
            border: none;
            color: white;
            padding: 0.375rem 0.75rem;
            border-radius: 10px;
            transition: all 0.2s ease; /* 添加过渡效果使变化更平滑 */
        }

        /* 鼠标悬停状态 */
        .custom-certificate-btn:hover {
            background: #0069d9;
            color: white;
        }

        /* 点击状态 */
        .custom-certificate-btn:active,
        .custom-certificate-btn:focus {
            background: #0069d9 !important;
            color: white !important;
            box-shadow: none !important; /* 移除点击时的阴影效果 */
            outline: none !important; /* 移除点击时的轮廓线 */
        }

        .text-success {
            color: #16c17a !important;
        }

        .text-danger {
            color: #f93139 !important;
        }

    </style>
</head>

<body class="poppins-bold">
<div class="user-name"><span id="userName"></span></div>

<header class="background-container">
    <img id="header-img" src="" alt="ST">
</header>
<main class="container mt-4" id="mainContent">
    <ul class="nav nav-pills mt-4" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="lean-student-tab" data-bs-toggle="pill" data-bs-target="#lean-student"
                    type="button" role="tab" aria-controls="lean-student" aria-selected="true" data-role="精益学员">
                精益学员
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="lean-backbone-tab" data-bs-toggle="pill" data-bs-target="#lean-backbone"
                    type="button" role="tab" aria-controls="lean-backbone" aria-selected="false" data-role="精益骨干">
                精益骨干
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="lean-coach-tab" data-bs-toggle="pill" data-bs-target="#lean-coach"
                    type="button" role="tab" aria-controls="lean-coach" aria-selected="false" data-role="精益教练">
                精益教练
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="senior-coach-tab" data-bs-toggle="pill" data-bs-target="#senior-coach"
                    type="button" role="tab" aria-controls="senior-coach" aria-selected="false" data-role="资深教练">
                资深教练
            </button>
        </li>
    </ul>

    <div class="tab-content mt-4">
        <div class="tab-pane fade show active" id="timeline" role="tabpanel" aria-labelledby="timeline-tab">
            <div class="timeline-container" id="timeline-content"></div>
        </div>
    </div>

    <div class="text-center">
        <button id="signup-button" class="btn custom-btn btn-lg text-light">立即报名</button>
    </div>

    <!-- Modal HTML (Add this to your HTML body) -->
    <div class="modal fade" id="projectExperienceModal" tabindex="-1" aria-labelledby="exampleModalLabel"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">申请考试</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="project-experience">请输入您的项目经验：
                        <br><span class="text-danger">要求报名人员参与单个精益项目6个月以上。</span>
                    </label>
                    <textarea id="project-experience" class="form-control" rows="4"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submit-experience">提交经验</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal HTML (Add this to your HTML body) -->
    <div class="modal fade" id="optionsModal" tabindex="-1" aria-labelledby="optionsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="optionsModalLabel">请选择您要访问的页面</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>您已完成考试，请选择以下选项：</p>
                    <button type="button" class="btn btn-primary" id="summaryButton">个人工作总结与发展计划</button>
                    <button type="button" class="btn btn-primary" id="selfAssessmentButton">个人自评表
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
<script>

    // 全局变量
    const domCache = {
        // 常用元素
        timelineContainer: null,
        signupButton: null,
        userNameElement: null,
        headerImg: null,
        leanStudentTab: null,
        leanBackboneTab: null,
        // 模态框相关
        projectExperienceModal: null,
        optionsModal: null,
        submitExperienceButton: null,
        summaryButton: null,
        selfAssessmentButton: null
    };
    let userName = getNameFromUrl("userName");
    let currentRole;
    let nowRole;
    let tabRole = '精益学员';
    let userStatus;
    let userData;
    let specialRole = false;
    let userIntroData;
    const ROLES = {
        LEAN_STUDENT: "精益学员",
        LEAN_BACKBONE: "精益骨干",
        LEAN_COACH: "精益教练",
        SENIOR_COACH: "资深教练"
    };

    // 1. 状态管理优化
    const STATUS = {
        COMPLETED: "已完成",
        IN_PROGRESS: "进行中",
        PENDING: "未开始",
        REJECTED: "未通过",
        APPROVED: "已通过"
    };

    const completedText = STATUS.APPROVED;
    const redirectURL = `lean_list.html?gzbh=${userName}`;
    const redirectSummaryURL = `work_summary.html?userName=${userName}&role=${ROLES.LEAN_BACKBONE}`;
    const redirectSelfAssessmentURL = `lean_intro.html?userName=${userName}&role=${ROLES.LEAN_BACKBONE}`;

    // 状态样式映射
    function getStatusStyles(status) {
        const statusMap = {
            "已完成": {statusClass: "completed", badgeClass: "bg-success"},
            "已通过": {statusClass: "completed", badgeClass: "bg-success"},
            "进行中": {statusClass: "in-progress", badgeClass: "bg-warning"},
            "审核中": {statusClass: "in-progress", badgeClass: "bg-warning"},
            "未开始": {statusClass: "pending", badgeClass: "bg-secondary"},
            "未通过": {statusClass: "pending", badgeClass: "bg-danger"},
            "审核不通过": {statusClass: "pending", badgeClass: "bg-danger"}
        };
        return statusMap[status] || {statusClass: "pending", badgeClass: "bg-secondary"};
    }


    // 考试信息显示逻辑
    function getExamDisplayInfo(data) {
        // 已通过的显示考试成绩不显示考试信息
        if (data.exam_result === "已通过") {
            return {showExamInfo: false, showScore: true};
        }

        // 没有成绩且结果是未通过或已开始时隐藏考试信息
        const shouldHideExamInfo = !data.exam_score &&
            (data.exam_result === "未通过" || data.exam_result === "已开始");

        // 有成绩且结果不是未通过时显示分数
        const shouldShowScore = data.exam_score && data.exam_result !== "未通过";

        return {
            showExamInfo: !shouldHideExamInfo,
            showScore: shouldShowScore
        };
    }

    // 证书查看权限
    function canViewCertificate(data, role) {

        if (role === ROLES.LEAN_BACKBONE) {

            return data.stage_name === "认证结果" && userStatus;
        }

        if (role === ROLES.LEAN_STUDENT) {
            return data.stage_name === "认证考试" && (nowRole !== ROLES.LEAN_STUDENT || userStatus);
        }
        return false;
    }

    // 加载并生成时间线
    async function loadAndGenerateTimeline(userName, currentRole) {
        const {currentData: loadedData, userStatus: loadedStatus} = await queryUserData(userName, currentRole);
        userData = loadedData;
        userStatus = loadedStatus;
        const processedData = handleSpecialRoleTimeline(userData);
        generateTimeline(processedData, currentRole);
    }

    // 加载用户列表
    async function loadList(userName) {
        const response = await fetchDataFromAPI('662', userName);
        let currentRole = null;
        let userStatus = null;
        let specialRole = null;
        if (response.data.status === 0) {
            currentRole = response.data.user;
            userStatus = response.data.user_status;
            specialRole = response.data.special;
            if (domCache.userNameElement && response.data.user_name) {
                domCache.userNameElement.textContent = response.data.user_name;
            }
        }
        updateTabAccessibility(currentRole, userStatus);
        return {currentRole, userStatus, specialRole};
    }

    // 更新标签页的可访问性
    function updateTabAccessibility(currentRole, userStatus) {
        const roleButtons = document.querySelectorAll('.nav-link');
        roleButtons.forEach((button) => {
            const role = button.getAttribute('data-role');
            const isActiveRole = role === currentRole;
            const isEnabled = role === ROLES.LEAN_STUDENT ||
                (role === ROLES.LEAN_BACKBONE && userStatus);
            //||(role === ROLES.LEAN_COACH && userStatus && currentRole === ROLES.LEAN_BACKBONE) ||
            // (role === ROLES.SENIOR_COACH && userStatus && currentRole === ROLES.SENIOR_COACH);

            button.disabled = !isEnabled && !isActiveRole;
            if (button.disabled) {
                button.classList.add('disabled-button');
            } else {
                button.classList.remove('disabled-button');
            }
        });
    }

    // 查询用户数据
    async function queryUserData(userName, currentRole) {
        const response = await fetchDataFromAPI('663', {
            workId: userName,
            role: currentRole,
        });
        let currentData = null;
        let userStatus = null;
        if (response.data.status === 0) {
            currentData = response.data.certifications;
            userStatus = response.data.user_status;
        }
        return {currentData, userStatus};
    }

    // 生成时间线
    function generateTimeline(roleData, role) {
        domCache.timelineContainer.innerHTML = '';

        const examStage = roleData.find(item => item.stage_name === "认证考试");
        if (examStage && examStage.status === STATUS.COMPLETED) {
            domCache.timelineContainer.classList.add('completed-exam');
        } else {
            domCache.timelineContainer.classList.remove('completed-exam');
        }

        roleData.forEach(item => {
            domCache.timelineContainer.innerHTML += createTimelineItem(item, role);
        });

        updateSignupButton(roleData, role);
    }

    // 申请考试
    async function applyForExam(userName, currentRole, projectExperience) {
        let stage_name;
        if (currentRole === ROLES.LEAN_STUDENT)
            stage_name = "认证考试";
        else if (currentRole === ROLES.LEAN_BACKBONE)
            stage_name = "项目经验审核";

        const feedbackData = {
            workId: userName,
            role: currentRole,
            stage_name: stage_name,
            project_experience: projectExperience
        };
        try {
            const response = await fetchDataFromAPI('667', feedbackData);
            if (response.data.status === 0) {
                if (currentRole === ROLES.LEAN_STUDENT)
                    alert("申请考试成功!");
                else if (currentRole === ROLES.LEAN_BACKBONE)
                    alert("申请考试成功，请等待审核");
                updateSignupButtonAfterExamApplied();
                location.reload();
            } else {
                console.error("Apply for Exam Error: ", response.data.data.msg);
                alert("考试申请失败，请重试。");
            }
        } catch (error) {
            console.error("Fetch Data Error: ", error);
            alert("请求失败，请稍后再试。");
        }
    }

    async function applyForBackboneExam(userName, currentRole, projectExperience) {

        const feedbackData = {
            workId: userName,
            role: currentRole,
            stage_name: "认证考试",
            project_experience: projectExperience
        };
        try {
            const response = await fetchDataFromAPI('702', feedbackData);
            if (response.data.status === 0) {
                alert("申请考试成功，请等待审核");
                updateSignupButtonAfterExamApplied();
                location.reload();

            } else {
                console.error("Apply for Exam Error: ", response.data.data.msg);
                alert("考试申请失败，请重试。");
            }
        } catch (error) {
            console.error("Fetch Data Error: ", error);
            alert("请求失败，请稍后再试。");
        }
    }

    // 骨干申请
    async function applyForSignUp(userName) {
        const feedbackData = {
            workId: userName
        };
        try {
            const response = await fetchDataFromAPI('692', feedbackData);
            if (response.data.status === 0) {
                alert("申请成功！");
                location.reload();
            } else {
                console.error("Apply for Exam Error: ", response.data.msg);
                alert("考试申请失败，请重试。");
            }
        } catch (error) {
            console.error("Fetch Data Error: ", error);
            alert("请求失败，请稍后再试。");
        }
    }

    // 更新考试申请后的按钮状态
    function updateSignupButtonAfterExamApplied() {
        domCache.signupButton.innerText = "等待考试";
        domCache.signupButton.disabled = true;
    }

    // 更新报名按钮状态
    function updateSignupButton(roleData, role) {
        updateButtonState(domCache.signupButton, {
            text: "立即报名",
            disabled: false,
            onClick: () => location.href = redirectURL
        });

        switch (role) {
            case ROLES.LEAN_STUDENT:
                handleLeanStudent(roleData, domCache.signupButton);
                break;
            case ROLES.LEAN_BACKBONE:
                handleLeanBackbone(roleData, domCache.signupButton);
                break;
            case ROLES.LEAN_COACH:
                handleLeanCoach(roleData, domCache.signupButton);
                break;
            case ROLES.SENIOR_COACH:
                handleSeniorCoach(roleData, domCache.signupButton);
                break;
            default:
                break;
        }
    }

    function tabTab() {
        domCache.leanStudentTab.classList.remove('active');
        domCache.leanBackboneTab.classList.add('active');
        loadAndGenerateTimeline(userName, ROLES.LEAN_BACKBONE);
    }

    // 处理精益学员角色的按钮状态
    function handleLeanStudent(roleData, signupButton) {
        const registrationStage = roleData.find(item => item.stage_name === "认证报名");
        const examStage = roleData.find(item => item.stage_name === "认证考试");
        if (!userStatus && nowRole !== ROLES.LEAN_STUDENT) {
            userStatus = true;
        }

        if (userStatus && nowRole === ROLES.LEAN_STUDENT) {
            // 精益学员已完成
            signupButton.innerText = "申请骨干报名";
            signupButton.onclick = tabTab;
            return;
        } else if (userStatus && userData) {
            signupButton.innerText = completedText;
            signupButton.disabled = true;
            return;
        }

        if (registrationStage) {
            if (registrationStage.status === STATUS.IN_PROGRESS) {
                // 若认证报名处于进行中状态，设置按钮文本为"请等待审核"，并禁用按钮
                signupButton.innerText = "请等待审核";
                signupButton.disabled = true;
            } else if (registrationStage.status === STATUS.COMPLETED) {
                // 若认证报名已完成，设置按钮文本为"申请考试"，并绑定点击事件
                signupButton.innerText = "申请考试";
                signupButton.onclick = async () => {
                    if (confirm("已经学习完成，确认考试吗？")) {
                        await applyForExam(userName, currentRole);
                    }
                };
            }
        }

        if (examStage) {
            if (examStage.status === STATUS.IN_PROGRESS) {
                // 若认证考试处于进行中状态，更新按钮状态为"等待考试"
                updateSignupButtonAfterExamApplied();
            } else if (examStage.status === STATUS.COMPLETED && examStage.exam_result === STATUS.APPROVED) {
                // 若认证考试已完成，设置按钮文本为STATUS.APPROVED，并禁用按钮
                signupButton.innerText = completedText;
                signupButton.disabled = true;
            }
        }
    }

    // 处理精益骨干角色的按钮状态
    function handleLeanBackbone(roleData, signupButton) {
        const registrationStage = roleData.find(item => item.stage_name === "认证考试");
        const leanStage = roleData.find(item => item.stage_name === "认证学习");
        const experience = roleData.find(item => item.stage_name === "项目经验审核");
        const intro = roleData.find(item => item.stage_name === "个人总结与自评");
        if (userStatus && userData) {
            // 若用户状态为已完成且有用户数据，设置按钮文本为STATUS.APPROVED，并禁用按钮
            signupButton.innerText = completedText;
            signupButton.disabled = true;
            return;
        }

        if (leanStage && leanStage.status === STATUS.PENDING) {
            // 若认证学习阶段未开始，设置按钮文本为"申请报名"，并绑定点击事件
            signupButton.innerText = "申请报名";
            signupButton.onclick = async () => {
                await applyForSignUp(userName);
            };
            return;
        }

        if (experience) {
            if (experience.status === STATUS.PENDING || experience.status === STATUS.REJECTED) {
                // 若认证考试阶段未开始，设置按钮文本为"申请考试"，并绑定点击事件以显示项目经验模态框
                signupButton.innerText = "申请考试";
                signupButton.onclick = () => {
                    const modal = new bootstrap.Modal(domCache.projectExperienceModal);
                    modal.show();
                };
            } else if (experience.status === STATUS.IN_PROGRESS) {
                // 若认证考试阶段进行中，设置按钮文本为"请等待考试"，并禁用按钮
                signupButton.innerText = "请等待审核";
                signupButton.disabled = true;
            } else if (experience.status === STATUS.COMPLETED || experience.status === STATUS.APPROVED) {
                // 若认证考试阶段已完成，设置按钮文本为"填写信息"，并绑定点击事件以显示选项模态框
                if (registrationStage) {
                    if (registrationStage.status === STATUS.IN_PROGRESS) {
                        // 若认证考试阶段进行中，设置按钮文本为"请等待考试"，并禁用按钮
                        signupButton.innerText = "请等待考试";
                        signupButton.disabled = true;
                    } else if (registrationStage.status === STATUS.COMPLETED) {
                        // 若认证考试阶段已完成，设置按钮文本为"填写信息"，并绑定点击事件以显示选项模态框
                        signupButton.innerText = "填写信息";
                        signupButton.onclick = () => {
                            const optionsModal = new bootstrap.Modal(domCache.optionsModal);
                            optionsModal.show();
                        };
                    } else {
                        // 若认证报名已完成，设置按钮文本为"申请考试"，并绑定点击事件
                        signupButton.innerText = "申请考试";
                        signupButton.onclick = async () => {
                            if (confirm("确认申请骨干考试吗？")) {
                                await applyForBackboneExam(userName, currentRole);
                            }
                        };
                    }
                }
            }
        }

        if (intro) {
            if (intro.status === STATUS.APPROVED) {
                signupButton.innerText = "请等待结果";
                signupButton.disabled = true;
            }
        }
    }

    // 处理精益教练角色的按钮状态
    function handleLeanCoach(roleData, signupButton) {
        const registrationStage = roleData.find(item => item.stage_name === "认证报名");

        if (userStatus && userData) {
            // 若用户状态为已完成且有用户数据，设置按钮文本为STATUS.APPROVED，并禁用按钮
            signupButton.innerText = completedText;
            signupButton.disabled = true;
        }

        if (registrationStage) {
            if (registrationStage.status === STATUS.PENDING) {
                // 若认证报名阶段未开始，设置按钮文本为"立即报名"，并绑定点击事件进行页面跳转
                signupButton.innerText = "立即报名";
                signupButton.onclick = () => location.href = redirectURL;
            } else if (registrationStage.status === STATUS.IN_PROGRESS) {
                // 若认证报名阶段进行中，设置按钮文本为"请等待审核"，并禁用按钮
                signupButton.innerText = "请等待审核";
                signupButton.disabled = true;
            }
        }
    }

    function updateButtonState(button, options) {
        button.innerText = options.text;
        button.disabled = options.disabled;
        button.onclick = options.onClick;
        button.classList.toggle('disabled-button', options.disabled);
    }

    // 处理资深教练角色的按钮状态
    function handleSeniorCoach(roleData, signupButton) {
        if (userStatus && userData) {
            // 若用户状态为已完成且有用户数据，设置按钮文本为"已达到当前阶段，不可重复报名"，并禁用按钮
            signupButton.innerText = "已达到当前阶段，不可重复报名";
            signupButton.disabled = true;
        }
    }

    // 定义状态颜色映射函数
    function getStatusColorClass(status) {
        switch (status) {
            case "已审核":
            case STATUS.APPROVED:
                return "text-success";
            case "未审核":
            case "审核中":
                return "text-warning";
            case STATUS.REJECTED:
            case "审核不通过":
                return "text-danger";
            default:
                return "text-secondary";
        }
    }

    // 通用创建时间线项目函数
    function createTimelineItem(data, role) {
        const {statusClass, badgeClass} = getStatusStyles(data.status);

        const {showExamInfo, showScore} = {showExamInfo: false, showScore: true};
        if (data.stage_name === "认证考试") {
            const {showExamInfo, showScore} = getExamDisplayInfo(data);
        }
        const canViewCert = canViewCertificate(data, role);
        const resultColorClass = getStatusColorClass(data.exam_result);

        // 构建阶段特定内容
        const stageSpecificContent = buildStageSpecificContent(data, role, {
            statusClass,
            badgeClass,
            showExamInfo,
            showScore,
            canViewCert,
            resultColorClass
        });

        return `
                <div class="timeline-item">
                  <div class="timeline-point ${statusClass}"></div>
                  <div class="content-card">
                    <h6 class="mb-2 fw-bold">
                      ${data.stage_name}
                      ${data.stage_name === "认证考试" || data.stage_name === "个人总结与自评" ?
            `<span class="badge ${badgeClass} badge-small">${data.status}</span>` : ''}
                    </h6>
                    ${stageSpecificContent}
                  </div>
                </div>
              `;
    }

    // 构建阶段特定内容
    function buildStageSpecificContent(data, role, options) {
        const {
            showExamInfo,
            showScore,
            canViewCert,
            resultColorClass
        } = options;

        switch (data.stage_name) {
            case "认证学习":
                return `<p>${data.stage_description}</p>`;

            case "认证报名":
                return buildRegistrationContent(data);

            case "认证考试":
                return buildExamContent(data, showExamInfo, showScore, canViewCert, resultColorClass);

            case "个人总结与自评":
                return buildSelfEvaluationContent(data);

            case "认证结果":
                return buildLeanContent(data, canViewCert);

            default:
                return buildDefaultContent(data, options);
        }
    }

    // 构建报名内容
    function buildRegistrationContent(data) {
        if (data.status === "已完成" || !data.start_time) {
            return `<p>${data.stage_description}</p>`;
        }

        return `
                <div class="d-flex justify-content-between align-items-center">
                  <p class="flex-grow-1 mb-0">${data.stage_description}</p>
                  <span class="badge ${getStatusStyles(data.status).badgeClass} badge-small">
                    ${data.status}
                  </span>
                </div>
                <div class="card mt-3 p-2 bg-primary text-light rounded">
                  <p class="mb-1"><strong>报名时间:</strong>
                    <span>${formatDate(data.start_time)}</span>
                  </p>
                  <p class="mb-1"><strong>审核时间:</strong>
                    <span>${formatDate(data.end_time)}</span>
                  </p>
                </div>
              `;
    }

    // 构建考试内容
    function buildExamContent(data, showExamInfo, showScore, canViewCert, resultColorClass) {
        return `
                <div class="mt-2">
                  ${showExamInfo ? buildExamTimeLocation(data) : ''}
                  ${showScore ? buildExamScore(data, resultColorClass) : ''}
                  ${canViewCert ? buildCertificateButton() : ''}
                </div>
              `;
    }

    //构建认证总结内容
    function buildLeanContent(data, canViewCert) {
        return `<div class="d-flex justify-content-between align-items-center">
                    <p class="flex-grow-1 mb-0">${data.stage_description}</p>
                </div>
                <div class="mt-2">
                  ${canViewCert ? buildCertificateButton() : ''}
                </div>
              `;
    }

    // 辅助函数
    function formatDate(date) {
        return date ? new Date(date).toLocaleString() : "暂无";
    }

    function buildExamTimeLocation(data) {
        return `
                <div class="card p-2 mb-3">
                  <p><strong>考试时间、地点:</strong></p>
                  <p class="exam_time">${data.exam_time || "暂无"}</p>
                  <p class="exam_time">${data.exam_location || "暂无"}</p>
                </div>
              `;
    }

    function buildExamScore(data, resultColorClass) {
        return `
                <div class="card p-2">
                  <h6 class="fw-bold d-flex justify-content-between">
                    <span>考试成绩:</span>
                    ${data.exam_score ? `
                      <span class="${resultColorClass}">
                        ${data.exam_score} 分 ${data.exam_result || ""}
                      </span>
                    ` : `
                      <span class="${resultColorClass}">${data.exam_result || "无结果"}</span>
                    `}
                  </h6>
                </div>
              `;
    }

    function buildCertificateButton() {
        return `
                <button class="btn custom-certificate-btn mt-2"
                        onclick="location.href='zhengshu.html?userName=${userName}&tabRole=${tabRole}'">
                  查看证书
                </button>
              `;
    }

    /**
     * 构建个人总结与自评内容
     * @param {Object} data 时间线项目数据
     * @returns {string} 生成的HTML内容
     */
    function buildSelfEvaluationContent(data) {
        // 如果状态是已完成，则不显示内容
        if (data.status === STATUS.COMPLETED) {
            return '';
        }

        return `
                <div class="card p-2 mb-3">
                  ${userIntroData.map(item => `
                    <div>
                      <span class="${getStatusColorClass(item.status)}">
                        ${item.name || "暂无"} - ${item.status || "暂无"}
                      </span>
                      ${item.status === STATUS.REJECTED && item.reason ? `
                        <div class="card mt-2 p-2 bg-danger text-light rounded">
                          <p class="mb-0"><strong>不通过原因:</strong> ${item.reason}</p>
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              `;
    }

    /**
     * 构建默认内容（用于非特殊阶段）
     * @param {Object} data 时间线项目数据
     * @param {Object} options 配置选项
     * @returns {string} 生成的HTML内容
     */
    function buildDefaultContent(data, options) {
        const {badgeClass} = options;

        // 如果有开始时间且状态不是"已通过"，显示时间卡片
        const shouldShowTimeCard = data.start_time && data.status !== STATUS.APPROVED;
        const timeCard = shouldShowTimeCard ? `
        <div class="card mt-3 p-2 bg-primary text-light rounded">
            <p class="mb-1"><strong>报名时间:</strong>
                <span>${formatDate(data.start_time)}</span>
            </p>
            ${data.end_time ? `
                <p class="mb-1"><strong>审核时间:</strong>
                    <span>${formatDate(data.end_time)}</span>
                </p>
            ` : ''}
        </div>
    ` : '';

        return `
        <div class="d-flex justify-content-between align-items-center">
            <p class="flex-grow-1 mb-0">${data.stage_description}</p>
            <span class="badge ${badgeClass} badge-small">${data.status}</span>
        </div>
        ${timeCard}
    `;
    }

    // 加载用户角色
    async function loadUserRole(userName) {
        const response = await fetchDataFromAPI('690', userName);
        return response.data.status;
    }

    // 加载用户个人总结
    async function loadUserIntro(userName) {
        const response = await fetchDataFromAPI('704', userName);
        if (response.data.status === 0) {
            userIntroData = response.data.data;
        }
        return userIntroData;
    }

    /**
     * 处理特殊角色时间线数据
     * 当specialRole为true时，将所有时间线项目的状态设置为"已完成"
     * @param {Array} timelineData 原始时间线数据
     * @returns {Array} 处理后的时间线数据
     */
    function handleSpecialRoleTimeline(timelineData) {
        if (!specialRole) {
            return timelineData; // 如果不是特殊角色，直接返回原数据
        }

        // 如果是特殊角色，将所有项目状态设置为"已完成"
        return timelineData.map(item => {
            return {
                ...item,
                status: STATUS.COMPLETED,
                exam_result: STATUS.APPROVED, // 如果有考试结果也设置为已通过
            };
        });
    }

    // 页面加载完成后的初始化操作
    document.addEventListener("DOMContentLoaded", async function () {
        // 检查是否获取到userName
        const userRole = await loadUserRole(userName);
        if (!userName || userRole === 0) {
            // 弹出提示并重定向到另一个页面
            alert("无权限访问，请退出。");
            window.location.href = "http://edi.sdstg.com/"; // 这里设置你的重定向URL
            return; // 确保后续的代码不再执行
        }

        // 缓存DOM元素
        domCache.timelineContainer = document.getElementById('timeline-content');
        domCache.signupButton = document.getElementById('signup-button');
        domCache.userNameElement = document.getElementById('userName');
        domCache.headerImg = document.getElementById('header-img');
        domCache.leanStudentTab = document.getElementById('lean-student-tab');
        domCache.leanBackboneTab = document.getElementById('lean-backbone-tab');

        // 模态框相关
        domCache.projectExperienceModal = document.getElementById('projectExperienceModal');
        domCache.optionsModal = document.getElementById('optionsModal');
        domCache.submitExperienceButton = document.getElementById('submit-experience');
        domCache.summaryButton = document.getElementById('summaryButton');
        domCache.selfAssessmentButton = document.getElementById('selfAssessmentButton');

        domCache.signupButton.innerText = "立即报名";
        domCache.signupButton.onclick = () => location.href = redirectURL;

        domCache.headerImg.src = '../logo/font_logo2.png';

        const {
            currentRole: loadedRole,
            userStatus: loadedStatus,
            specialRole: loadedSpecialRole
        } = await loadList(userName);
        currentRole = loadedRole;
        userStatus = loadedStatus;
        nowRole = loadedRole;
        specialRole = loadedSpecialRole;
        if (!currentRole) {
            return;
        }
        await loadUserIntro(userName);

        // 根据条件激活精益骨干标签页
        if (currentRole === ROLES.LEAN_BACKBONE) {
            domCache.leanStudentTab.classList.remove('active');
            domCache.leanBackboneTab.classList.add('active');
            currentRole = ROLES.LEAN_BACKBONE;
            tabRole = ROLES.LEAN_BACKBONE;
        }
        await loadAndGenerateTimeline(userName, currentRole);

        document.querySelectorAll('.nav-link').forEach(button => {
            button.addEventListener('click', async () => {
                const role = button.getAttribute('data-role');
                currentRole = role;
                tabRole = role;
                await loadAndGenerateTimeline(userName, role);
            });
        });
        if (domCache.submitExperienceButton) {
            domCache.submitExperienceButton.onclick = async () => {
                const projectExperience = document.getElementById('project-experience').value.trim();
                if (projectExperience) {
                    if (confirm("是否确认提交？")) {
                        await applyForExam(userName, currentRole, projectExperience);
                        const modal = bootstrap.Modal.getInstance(domCache.projectExperienceModal);
                        modal.hide();
                    }
                } else {
                    alert("项目经验不能为空！");
                }
            };
        }

        // 检查 userIntroData 中 "个人工作总结与发展计划" 的 status 是否为 STATUS.APPROVED
        const isSelfReviewApproved = userIntroData.some(
            item => item.name === "个人工作总结与发展计划" && item.status === STATUS.APPROVED
        );

        if (domCache.summaryButton) {
            domCache.summaryButton.disabled = isSelfReviewApproved;
            domCache.summaryButton.classList.toggle("disabled-button", isSelfReviewApproved);
            domCache.summaryButton.onclick = () => {
                window.location.href = redirectSummaryURL;
            };
        }
        // 检查 userIntroData 中 "个人自评表" 的 status 是否为 STATUS.APPROVED
        const selfAssessmentApproved = userIntroData.some(
            item => item.name === "个人自评表" && item.status === STATUS.APPROVED
        );

        // 获取按钮并设置 disabled 状态
        if (domCache.selfAssessmentButton) {
            domCache.selfAssessmentButton.disabled = selfAssessmentApproved;
            // 可选：添加视觉样式
            domCache.selfAssessmentButton.classList.toggle("disabled-button", selfAssessmentApproved);
            domCache.selfAssessmentButton.onclick = () => {
                window.location.href = redirectSelfAssessmentURL;
            };
        }
    });
</script>
</body>
</html>
