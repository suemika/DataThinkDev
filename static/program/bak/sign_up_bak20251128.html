<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实训课程</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --secondary-color: #94a3b8;
            --light-bg: #f8fafc;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        /* 模态框整体样式 */
        #trainingCoursesModal .modal-dialog {
            margin: 0.5rem;
            max-width: 100%;
        }

        #trainingCoursesModal .modal-content {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 模态框头部 */
        #trainingCoursesModal .modal-header {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            border-bottom: none;
            padding: 1rem 1.25rem;
            position: relative;
        }

        #trainingCoursesModal .modal-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        #trainingCoursesModal .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            z-index: 1;
            position: relative;
        }

        #trainingCoursesModal .btn-close {
            filter: invert(1);
            opacity: 0.8;
            padding: 0.5rem;
            z-index: 1;
            position: relative;
        }

        /* 模态框主体 */
        #trainingCoursesModal .modal-body {
            padding: 1rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        /* 统计摘要 */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            background: var(--light-bg);
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-number {
            font-size: 1.25rem;
            font-weight: 700;
            display: block;
            line-height: 1.2;
        }

        .stat-number.completed {
            color: var(--success-color);
        }

        .stat-number.in-progress {
            color: var(--warning-color);
        }

        .stat-number.pending {
            color: var(--secondary-color);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        /* 课程列表 */
        .course-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .course-item {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .course-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .course-item.completed {
            border-left-color: var(--success-color);
        }

        .course-item.in-progress {
            border-left-color: var(--warning-color);
        }

        .course-item.pending {
            border-left-color: var(--secondary-color);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .course-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
            margin: 0;
            flex: 1;
            padding-right: 0.5rem;
        }

        .course-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }

        .course-status.completed {
            background: #dcfce7;
            color: #166534;
        }

        .course-status.in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .course-status.pending {
            background: #f3f4f6;
            color: #374151;
        }

        .course-date {
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            align-items: center;
        }

        .course-date i {
            margin-right: 0.25rem;
            font-size: 0.8rem;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.5;
        }

        .empty-state h5 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.85rem;
            margin: 0;
        }

        /* 模态框底部 */
        #trainingCoursesModal .modal-footer {
            border-top: 1px solid #f1f5f9;
            padding: 1rem;
        }

        #trainingCoursesModal .btn {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-item {
            animation: fadeIn 0.3s ease-out forwards;
            animation-fill-mode: both;
        }

        .course-item:nth-child(1) { animation-delay: 0.05s; }
        .course-item:nth-child(2) { animation-delay: 0.1s; }
        .course-item:nth-child(3) { animation-delay: 0.15s; }
        .course-item:nth-child(4) { animation-delay: 0.2s; }
        .course-item:nth-child(5) { animation-delay: 0.25s; }
        .course-item:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>

<!-- 触发模态框的按钮 -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 text-center">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#trainingCoursesModal">
                查看实训课程
            </button>
        </div>
    </div>
</div>

<!-- 实训课程模态框（手机端优化版） -->
<div class="modal fade" id="trainingCoursesModal" tabindex="-1" aria-labelledby="trainingCoursesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- 模态框头部 -->
            <div class="modal-header text-white">
                <h5 class="modal-title" id="trainingCoursesModalLabel">
                    <i class="bi bi-journal-check me-2"></i>我的实训课程
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- 模态框主体 -->
            <div class="modal-body">
                <!-- 统计摘要 -->
                <div class="stats-summary">
                    <div class="stat-item">
                        <span class="stat-number completed">8</span>
                        <span class="stat-label">已完成</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number in-progress">3</span>
                        <span class="stat-label">进行中</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number pending">5</span>
                        <span class="stat-label">未开始</span>
                    </div>
                </div>

                <!-- 课程列表 -->
                <div class="course-list">
                        <div class="course-item completed">
                            <div class="course-header">
                                <h6 class="course-name">精益基础理论</h6>
                                <span class="course-status completed">已完成</span>
                            </div>
                            <div class="course-date">
                                <i class="bi bi-calendar-check"></i> 2023-09-30
                            </div>
                        </div>

                        <div class="course-item in-progress">
                            <div class="course-header">
                                <h6 class="course-name">价值流分析实战</h6>
                                <span class="course-status in-progress">进行中</span>
                            </div>
                            <div class="course-date">
                                <i class="bi bi-calendar-event"></i> 2023-11-15
                            </div>
                        </div>

                        <div class="course-item pending">
                            <div class="course-header">
                                <h6 class="course-name">5S现场管理</h6>
                                <span class="course-status pending">未开始</span>
                            </div>
                            <div class="course-date">
                                <i class="bi bi-calendar"></i> 2023-12-20
                            </div>
                        </div>

                        <div class="course-item completed">
                            <div class="course-header">
                                <h6 class="course-name">标准化工作流程</h6>
                                <span class="course-status completed">已完成</span>
                            </div>
                            <div class="course-date">
                                <i class="bi bi-calendar-check"></i> 2023-08-31
                            </div>
                        </div>

                        <div class="course-item in-progress">
                            <div class="course-header">
                                <h6 class="course-name">持续改进方法</h6>
                                <span class="course-status in-progress">进行中</span>
                            </div>
                            <div class="course-date">
                                <i class="bi bi-calendar-event"></i> 2023-11-25
                            </div>
                        </div>
                    </div>

                <!-- 空状态示例（注释掉，实际使用时根据需要显示） -->
                <!--
                <div class="empty-state">
                    <i class="bi bi-journal-x"></i>
                    <h5>暂无实训课程</h5>
                    <p>当前没有可用的实训课程</p>
                </div>
                -->
            </div>

            <!-- 模态框底部 -->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 课程项点击事件
        document.querySelectorAll('.course-item').forEach(item => {
            item.addEventListener('click', function() {
                const courseName = this.querySelector('.course-name').textContent;
                alert(`点击了课程: ${courseName}`);
                // 实际应用中这里可以跳转到课程详情页或展开更多信息
            });
        });

        // 简单的状态筛选功能（可根据需要扩展）
        const filterButtons = document.createElement('div');
        filterButtons.className = 'filter-buttons d-flex justify-content-center mb-3';
        filterButtons.innerHTML = `
            <button class="btn btn-sm btn-outline-primary active me-2">全部</button>
            <button class="btn btn-sm btn-outline-success me-2">已完成</button>
            <button class="btn btn-sm btn-outline-warning me-2">进行中</button>
            <button class="btn btn-sm btn-outline-secondary">未开始</button>
        `;

        // 将筛选按钮插入到统计摘要之前
        const modalBody = document.querySelector('#trainingCoursesModal .modal-body');
        const statsSummary = document.querySelector('.stats-summary');
        modalBody.insertBefore(filterButtons, statsSummary);

        // 筛选功能
        document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-buttons .btn').forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('btn-outline-primary', 'btn-outline-success', 'btn-outline-warning', 'btn-outline-secondary');
                });

                this.classList.remove('btn-outline-primary', 'btn-outline-success', 'btn-outline-warning', 'btn-outline-secondary');
                this.classList.add('active', 'btn-primary');

                const filter = this.textContent.trim();
                filterCourses(filter);
            });
        });

        function filterCourses(status) {
            const courses = document.querySelectorAll('.course-item');

            courses.forEach(course => {
                if (status === '全部') {
                    course.style.display = 'block';
                } else {
                    const courseStatus = course.querySelector('.course-status').textContent;
                    if (courseStatus === status) {
                        course.style.display = 'block';
                    } else {
                        course.style.display = 'none';
                    }
                }
            });
        }
    });
</script>
</body>
</html>
