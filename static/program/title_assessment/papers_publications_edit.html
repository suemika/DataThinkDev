<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>论文、著作填报</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>
        // 获取当前时间戳作为版本号
        const version = Date.now();
    </script>

    <link rel="icon" href="../vendor/logo.png?v=1" type="image/png">
    <link rel="stylesheet" href="../vendor/bootstrap5/css/bootstrap.css?v=${version}">
    <link rel="stylesheet" href="vendor/css/util.css"?v=${version}">
    <script src="../vendor/easyui/js-easyui/axios.min.js?v=${version}"></script>
    <script src="../vendor/bootstrap5/js/bootstrap.js?v=${version}"></script>
    <script src="vendor/util/util_link.js"?v=${version}"></script>
    <script src="../vendor/elementui/js/jquery-3.7.0.min.js?v=${version}"></script>
    <style>
        body {
            background-color: #f8f9fa; /* 设置背景颜色 */
        }

        header {
            background-color: #007bff; /* 头部背景色 */
            color: #fff; /* 文字颜色 */
            padding: 20px; /* 内边距 */
            text-align: center; /* 文字居中 */
            border-radius: 5px 5px 0 0; /* 圆角边框 */
            margin-bottom: 20px; /* 下边距 */
        }

        .module {
            padding: 20px; /* 内边距 */
            border-radius: 5px; /* 圆角 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* 投影效果 */
            background-color: #ffffff; /* 背景颜色 */
            margin-bottom: 20px; /* 下边距 */
        }

        .upload-area {
            padding: 10px;
            border: 2px dashed #007bff;
            border-radius: 5px;
            text-align: center;
            color: #007bff;
            margin-bottom: 10px; /* 上传区域下边距 */
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, .25);
            border-color: #007bff; /* 输入框聚焦颜色 */
        }
    </style>
</head>

<body>
<header class="background-container">
    <a href="http://edi.sdstg.com/" target="_self" rel="noopener">
        <img id="header-img" src="" alt="ST">
    </a>
    <h2 class="h2-container">论文、著作填报</h2>
</header>
<main class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <button onclick="goBack()" class="btn btn-info">返回</button>
        <button type="button" id="submitBtn" class="btn btn-success" onclick="submitFeedback(event)">
            提交
        </button>
    </div>

    <!-- Bootstrap Alert for Error Messages -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="module">
        <h5 class="mb-4">请填写以下信息</h5>
        <form id="feedbackForm">
            <div class="form-group mb-3">
                <label for="papersPublicationsName">名称</label>
                <input type="text" class="form-control" id="papersPublicationsName" name="papersPublicationsName"
                       required>
            </div>
            <div class="form-group mb-3">
                <label for="innovationRank">位次 (填写规则（*/*），如2/3)</label>
                <input type="text" class="form-control" id="innovationRank" name="role" required pattern="^\d+\/\d+$"
                       value="1/1">
                <div class="form-text">请按照规则填写，如2/3。</div>
            </div>
            <div class="form-group mb-3">
                <label for="publicationName">刊物名称</label>
                <input type="text" class="form-control" id="publicationName" name="publicationName" required>
            </div>
            <div class="form-group mb-3">
                <label for="attachment">证明材料</label>
                <div class="upload-area">
                    <input type="file" class="form-control-file" id="attachment" name="attachment" accept=".pdf">
                    <small class="form-text">请上传PDF格式的证明材料</small>
                </div>
            </div>
        </form>
    </div>
</main>
<script>
    const uuid = getNameFromUrl('uuid');
    const workID = getNameFromUrl('workID');
    const itemId = getNameFromUrl('itemId');
    const edit_name = 'papers_publications';
    const del_name = 'ZCJ_论文';
    const table_id = "853";
    $(document).ready(function () {

        if (workID === "null") {
            window.location.href = `main.html?uuid=${encodeURIComponent(uuid)}`;
        } else if (itemId) {
            loadProjectData(itemId); // 如果有 itemId，加载数据
        }


    });

    function goBack() {
        window.location.href = `${edit_name}.html?uuid=${encodeURIComponent(uuid)}&workID=${encodeURIComponent(workID)}&refresh=true`;
    }

    async function loadProjectData(id) {
        try {
            // 使用 FormData 取得表单数据
            const formData = new FormData();
            formData.append('name', edit_name);
            formData.append('workID', workID);
            formData.append('pid', uuid);
            formData.append('itemId', id); // 添加 itemId 用于修改数据

            const response = await fetchDataFromAPI('638', Object.fromEntries(formData)); // 根据实际 API 进行更改
            if (response.data.data.item) {
                const project = response.data.data.item[0];
                // 填充表单数据
                document.getElementById('papersPublicationsName').value = project[0];
                document.getElementById('innovationRank').value = project[1];
                document.getElementById('publicationName').value = project[2];

                // 检查是否有附件
                // 检查附件
                if (project[3]) { // 假设后端返回的项目数据中有 attachmentUrl 字段
                    const attachmentMessage = document.createElement('div');
                    attachmentMessage.innerHTML = `
                    <small class="form-text text-success">
                        当前附件: <a href="${project[3]}" target="_blank">点击查看</a>
                    </small>`;
                    document.querySelector('.upload-area').appendChild(attachmentMessage);
                }
            } else {
                showMsg('未找到项目数据！');
            }
        } catch (error) {
            showMsg('加载项目数据时发生错误。');
        }
    }

    async function submitFeedback(event) {
        event.preventDefault(); // Prevent default form submission

        const form = document.getElementById('feedbackForm');

        if (!validateForm(form)) return; // Validate form input

        const formData = new FormData(form);
        formData.append('name', edit_name);
        formData.append('workID', workID);
        formData.append('pid', uuid);
        formData.append('itemId', itemId); // 添加 itemId 用于修改数据
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true; // Disable button to prevent multiple submissions

        try {
            const apiAction = itemId ? '637' : '630'; // 修改和新增 API 接口的示例
            // 检查是否为新增操作，并且附件是否选择
            if (!itemId && document.getElementById('attachment').files.length === 0) { // 新增时确保上传了附件
                showMsg('请上传附件！');
                submitBtn.disabled = false; // Re-enable button
                return;
            }
            const response = await fetchDataFromAPI(apiAction, Object.fromEntries(formData));

            if (response.data.data_id !== "0") {
                // 检查文件输入框是否有文件
                const fileInput = document.getElementById('attachment');
                if (fileInput.files.length > 0) {
                    await uploadFiles(response.data.data_id);
                } else {
                    goBack(); // 如果没有文件，直接返回
                }
            } else {
                showMsg(response.data.msg);
            }
        } catch (error) {
            console.error('提交失败:', error);
            showMsg('提交过程中遇到错误，请重试！');
        } finally {
            submitBtn.disabled = false; // Re-enable button
        }
    }

    function validateForm(form) {
        const roleInput = document.getElementById('innovationRank').value;
        const rolePattern = /^\d+\/\d+/; // Validate role format
        if (!rolePattern.test(roleInput)) {
            showMsg('格式不正确，请按照规则填写，如2/3。');
            return false;
        }

        if (!form.checkValidity()) {
            showMsg('请填写所有必填项！');
            return false;
        }

        return true;
    }

    async function uploadFiles(data) {
        const fileInput = document.getElementById('attachment');
        if (!fileInput.files.length) {
            showMsg('请选择要上传的文件！');
            return;
        }

        const files = Array.from(fileInput.files);
        const uploadPromises = files.map(file => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('filterRules', JSON.stringify([
                {field: "table_id", op: "equal", value: table_id},
                {field: "row_id", op: "equal", value: data},
                {field: "uploadType", op: "equal", value: ""}
            ]));

            return axios.post('/imc/uploadAttachments', formData);
        });

        try {
            const responses = await Promise.all(uploadPromises);
            responses.forEach(response => console.log('上传成功:', response.data));
            await updateFilePath(data);
        } catch (error) {
            console.error('上传失败:', error);
            showMsg('文件上传失败，请检查网络连接或文件格式！');
        }
    }

    async function updateFilePath(data) {
        const formData = new FormData();
        formData.append('up_name', del_name);
        formData.append('tableId', table_id);
        formData.append('itemId', data);

        try {
            const response = await fetchDataFromAPI('633', Object.fromEntries(formData));
            if (response.data.msg === '1') {
                goBack();
            } else {
                showMsg('更新附件地址失败！');
            }
        } catch (error) {
            console.error('更新失败:', error);
            showMsg('更新过程中遇到错误，请重试！');
        }
    }

</script>
</body>
</html>
