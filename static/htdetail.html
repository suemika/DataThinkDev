	<script>
		$(document).ready(function(){
			
			//获取当前人员、合同号等基础信息
			//var sessionid=sessionStorage.getItem("sessionidd");
			
			var nowUrl=window.location.href;
						
			var url=nowUrl.substring(0,nowUrl.indexOf('htdetail.html'));
						
			var id=getQueryVariable("ID");
						
			var queryData=[{ "field": "ID","op":"equal", "value": id }]
			var queryStr=JSON.stringify(queryData);
			
			var htfnumber="";
			var Amount = 0.0;
			
			
			$.ajax({
				type: "post",
				async:false,
				url: url+"imc/queryData",
				data: {
					req: "m603Req",
					page: 1,
					rows: 50,
					sort: "ID", 
					order: "asc",
					filterRules: queryStr,
					pid: ""
				},
				success: function(data) {	
					
					$("#conFumber").val(data.rows[0].合同编码);
					$("#companyName").val(data.rows[0].公司名称);
					$("#conName").val(data.rows[0].合同名称);
					$("#projectName").val(data.rows[0].项目名称);
					
					htfnumber=data.rows[0].合同编码;
					Amount=data.rows[0].合同金额;
					
				
					$("#amount").val(data.rows[0].合同金额);
					$("#amountflag").val(data.rows[0].暂估价);
					$("#agentPer").val(data.rows[0].经办人);
					
					$("#taxRate").val(data.rows[0].税率);
					$("#taxNotAmount").val(data.rows[0].不含税金额);
					
					
					
								
				},
				error:function(data){
					dialogTest("表单信息获取失败！");
				
				}
			})
			
			var yfkAmount=0.0
			
			
			var queryData=[{ "field": "合同编号","op":"equal", "value": htfnumber }]
			var jsonStr=JSON.stringify(queryData);
			
			$.ajax({
				type: "post",
				async:false,
				url: url+"imc/queryData",
				data: {
					req: "m602Req",
					page: 1,
					rows: 50,
					sort: "ID", 
					order: "asc",
					filterRules: jsonStr,
					pid: ""
				},
				success: function(data) {	
					var str='';
					
					for(var i=0;i<data.rows.length;i++){

						str+='<tr><td style="display:none">'+data.rows[i].ID+'</td><td>'+data.rows[i].付款前置手续编号+'</td><td>'+data.rows[i].费用走向+'</td><td>'+data.rows[i].挂账金额+'</td><td>'+data.rows[i].计划支出日期+'</td><td>'+data.rows[i].收款银行名称+'</td><td>'+data.rows[i].收款银行行号+'</td><td>'+data.rows[i].收款银行账号+'</td><td>'+data.rows[i].实际付款金额+'</td><td><button type="button" id="editBtnTab" class="btn btn-warning" style="width:60px;margin-right:10px;dispaly:none;" onclick="changeToInput('+(i+1)+')">编辑</button><button type="button" id="saveBtnTab" class="btn btn-success" style="width:60px;margin-right:10px;display:none;" onclick="changeToSave('+(i+1)+')">保存</button></td></tr>'
						yfkAmount+=parseFloat(data.rows[i].实际付款金额);
					}				
					
					$('#htDetailTab').append(str);
					$('#payedAmount').val(yfkAmount);
					var amount=parseFloat($('#amount').val());
					var rate=yfkAmount/amount*100;
					$('#notPayedRate').val(rate.toFixed(2));
					var num=amount-yfkAmount
					$('#notPayedAmount').val(num);		
					
				},
				error:function(data){
					dialogTest("表单信息获取失败！");
				
				}
			})

			
			
			
				
		})
		
		
		function getCookie(name){
		  var arr,reg=new RegExp("(^| )"+name+"=([^;]*)(;|$)");
		  if(arr=document.cookie.match(reg)){
			return unescape(arr[2]);
		  }else{
			return null;
		  }
		}

		
		function formatDate(date) {
		  const day = date.getDate().toString().padStart(2, '0');
		  const month = (date.getMonth() + 1).toString().padStart(2, '0'); // 月份是从0开始的
		  const year = date.getFullYear();
		  const hours = date.getHours().toString().padStart(2, '0');
		  const minutes = date.getMinutes().toString().padStart(2, '0');
		  const seconds = date.getSeconds().toString().padStart(2, '0');
		 
		  return `${year}-${month}-${day}`;
		}

		function fileDialog(str){
			$("#uploadType").val(str);
			$('#fileUploadModal').modal('show');
		}


		function changeToInput(index){
			
			var DataTab=document.getElementById("htDetailTab").rows[index];
			
			
			for(var  i=2;i<DataTab.cells.length-1;i++){
				var value=DataTab.cells[i].innerHTML;
				DataTab.cells[i].innerHTML='<input type="text" class="form-control" value="'+value+'">';
				
			}
		
			DataTab.cells[DataTab.cells.length-1].children[0].style.display="none";
			DataTab.cells[DataTab.cells.length-1].children[1].style.display="block";
			//DataTab.cells[DataTab.cells.length-1].children[0].style.display="block";
			//DataTab.cells[DataTab.cells.length-1].children[1].style.display="none";
			
		}
		
		function changeToSave(index){
			
			var DataTab=document.getElementById("htDetailTab").rows[index];
			
			
			var ID=DataTab.cells[0].innerHTML;
			var fnumber= DataTab.cells[1].innerHTML;
			var amountType= DataTab.cells[2].children[0].value;
			var amount= DataTab.cells[3].children[0].value;
			var planDate= DataTab.cells[4].children[0].value;
			var bankName= DataTab.cells[5].children[0].value;
			var bankNum= DataTab.cells[6].children[0].value;
			var bankAcc= DataTab.cells[7].children[0].value;
			var actulAm= DataTab.cells[8].children[0].value;
		
			
			
			var dataStr=[{"ID":ID,"付款前置手续编号":fnumber,"费用走向":amountType,"挂账金额":amount,"计划支出日期":planDate,"收款银行名称":bankName,"收款银行行号":bankNum,"收款银行账号":bankAcc,"实际付款金额":actulAm}];
			var data= JSON.stringify(dataStr)
			
			var nowUrl=window.location.href;
						
			var url=nowUrl.substring(0,nowUrl.indexOf('htdetail.html'));
			
			$.ajax({
					type: "post",
					async:false,
					url: url+"imc/customOpt",
					data: {
						req: "627",
						data:data
					},
					success: function(data) {
						if(data.msg=='success'){
							dialogTest("添加成功！");
							for(var  i=2;i<DataTab.cells.length-1;i++){
								var object=DataTab.cells[i].children[0];
								DataTab.cells[i].innerHTML=object.value;
								
							}							
							DataTab.cells[DataTab.cells.length-1].children[0].style.display="block";
							DataTab.cells[DataTab.cells.length-1].children[1].style.display="none";
							
							//重新计算已还款金额和比例
							
							var tabObj=document.getElementById("htDetailTab");
							var num=0.0;
							for(var j=1;j<tabObj.rows.length;j++){
								num+=parseFloat(tabObj.rows[j].cells[8].innerHTML);
								
							}
							$('#payedAmount').val(num);
							var amount=parseFloat($('#amount').val());
							var rate=num/amount*100;
							$('#notPayedRate').val(rate.toFixed(2));
							$('#notPayedAmount').val(amount-num)	
							
							
						}else{
							dialogTest("添加失败,请联系开发人员处理!报错信息："+data.msg);
						}
					}
				})
			
			
			
			
			
		}
		
		
		function getQueryVariable(name) {
				var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
				var r = window.location.search.substr(1).match(reg);
				if (r != null) return unescape(r[2]);
				return null;
		}
		
		
		function dialogTest(str){
			
			
			document.getElementById("MsgText").innerHTML=str;
					
			$('#myModal').modal('show');
		}
		
	
		function closeWin(){
			
			history.back();
		}
		
		
		function generateUUID() {
			var d = new Date().getTime(); //Timestamp
			var d2 = (performance && performance.now && (performance.now()*1000)) || 0; //Time in microseconds since page-load or 0 if unsupported
			return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
				var r = Math.random() * 16; //random number between 0 and 16
				if(d > 0) { //Use timestamp until depleted
					r = (d + r)%16 | 0;
					d = Math.floor(d/16);
				} else { //Use microseconds since page-load if supported
					r = (d2 + r)%16 | 0;
					d2 = Math.floor(d2/16);
				}
				return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
			});
		}
 
	
		
	</script>
