<!DOCTYPE html>
<html lang="zh">

<head>
	<meta charset="UTF-8" />
	<title>imc-amis</title>
	<link rel="stylesheet" href="../../amissdk/cxd.css" />
	<script src="../../amissdk/sdk.js"></script>
	<script type="text/javascript" src="../../easyui/jquery-easyui/jquery.min.js"></script>
	<script src="../../amissdk/base64.min.js"></script>
	<style>
		html,
		body,
		.app-wrapper{
			position: relative;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}
		.amis-scope{
			background:white;
		}
	</style>
</head>

<body>
	<div id="root" class="app-wrapper"></div>

	<script type="text/javascript">

		function GetQueryString(name) {
			name = name.replace(/[]/,"\[").replace(/[]/,"\[").replace(/[]/,"\\\]");
			var regexS = "[\\?&]"+name+"=([^&#]*)";
			var regex = new RegExp( regexS );
			var results = regex.exec(window.location.href);
			if( results == null )
				return "";
			else {
				return results[1];
			}
		}

		(function () {
			req = GetQueryString("p");
			title = GetQueryString('title');
			$("title").html(decodeURIComponent(title));
			$.ajax({
				type: 'post',
				url: '/imc/queryData',
				data: {
					req: 'm8Req',
					page: '1',
					rows: '1',
					sort: 'req',
					order: 'asc',
					pid: '',
					filterRules: '[{"field":"req","op":"contains","value":"' + req + '"}]'
				},
				cache: false,
				dataType: 'json',
				success: function (msg) {
					console.log(msg);
					loadUI(JSON.stringify(msg));
				},
				error: function () {
				}
			});

			function loadUI(jsondata) {
				let amis = amisRequire('amis/embed');
				//let amisJSON = JSON.stringify(jsondata);
				let amisScoped = amis.embed('#root', JSON.parse(jsondata), {}, {
					theme: 'cxd'
				});
			}
		})();

	</script>
</body>

</html>
